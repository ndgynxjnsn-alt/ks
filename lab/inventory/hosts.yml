# LAB: the three Vagrant VMs (lab/Vagrantfile). The real environment uses its own inventory
# (template: inventories/example/).
all:
  children:
    nodes:
      hosts:
        lgtm1: { ansible_host: 192.168.56.11 }
        lgtm2: { ansible_host: 192.168.56.12 }
        lgtm3: { ansible_host: 192.168.56.13 }
      vars:
        # Password login and password sudo for the admin user "ops" (created by the Vagrantfile), no SSH keys.
        ansible_user: ops
        ansible_password: "{{ lookup('file', inventory_dir + '/../../.secrets/ops_password') }}"
        ansible_become_password: "{{ ansible_password }}"
        ansible_ssh_common_args: -o PubkeyAuthentication=no -o PreferredAuthentications=password
        # The lab network is isolated and has no gateway, but Kubernetes needs a default route.
        # The host bridge is used as a dead-end gateway: libvirt does not forward from isolated networks.
        default_gateway: 192.168.56.1
