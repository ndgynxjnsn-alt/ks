# LAB site settings (Vagrant VMs on 192.168.56.0/24, stand-in services from lab/external/).
# Everything that differs between sites lives in the inventory; ansible/group_vars/all.yml only holds
# what is the same everywhere (versions, charts, generated secrets). Template for a real site:
# inventories/example/group_vars/all.yml.

# ---------------------------------------------------------------- network
# Two floating IPs (kube-vip, ARP), both move to a surviving node when one fails:
vip: 192.168.56.10            # Kubernetes API (6443) and RKE2 join (9345)
ingress_vip: 192.168.56.20    # every LGTM hostname -> Traefik, which routes by Host header
# Hostnames are <name>.<domain> (names in lgtm_hosts below), each with its own certificate.
# DNS: *.<domain> -> ingress_vip (lab: BIND in lab/external, or /etc/hosts).
domain: lgtm.company.org
# Hostnames served on the ingress VIP (backends: ansible/templates/ingress.yaml.j2). Remove one to unpublish it.
lgtm_hosts: [grafana, loki, tempo, mimir, pyroscope, alloy, garage, argocd, headlamp, faro, pgbackweb]

# Grafana's PostgreSQL (CloudNativePG) on port 5432 of the ingress VIP, e.g. postgres.<domain>:5432 (TLS, scram).
grafana_db_external: true

# Storage: topolvm_disk is set per host in hosts.yml (ansible/disks.yml helps choosing).

# ---------------------------------------------------------------- company services
# Hosts of the company services the cluster uses. A real site puts their DNS names here (nexus.company.org,
# git.company.org). Lab: stand-ins on the Ansible host (lab/external), reached by its IP on the lab network
# because the lab has no DNS for these names.
nexus_host: "{{ lab_host_ip }}"     # artifact repository: UI/API + Helm repository :8091, Docker registry :8092
git_host: "{{ lab_host_ip }}"       # Git server (Gitea, https :3000): this repository and Grafana's

# ---------------------------------------------------------------- artifact repository (Nexus)
# Container images and Helm charts come from the company's Nexus (lab: lab/external): ansible/publish.yml pushes
# artifacts/ there; the nodes pull through containerd mirrors (/etc/rancher/rke2/registries.yaml), Argo CD
# reads the Helm repository. An image <registry>/<path> is stored as <host>/<registry>/<path>.
registry:
  host: "{{ nexus_host }}:8092"     # Docker registry API of the hosted repository lgtm-docker
  insecure: true                           # plain http (lab); https registries: ca_file below if not public
  # ca_file: /path/to/registry-ca.crt      # CA of an https registry (path on the Ansible host)
  # username / password                    # pull credentials (lab: anonymous read)
  publish:                                 # ansible/publish.yml pushes with this user (lab: role lgtm-publisher)
    helm_upload_url: "http://{{ nexus_host }}:8091/repository/lgtm-helm/"
    username: lgtm
    password: "{{ lookup('password', secrets_dir + '/nexus_password chars=ascii_letters,digits length=20') }}"

# ---------------------------------------------------------------- GitOps (Argo CD)
# Argo CD deploys from a Git repository (this repo, lab: Gitea from lab/external) and the Helm repository
# (Nexus). lgtm.yml pushes the committed HEAD to Gitea (gitops.publish).
gitops:
  repo_url: "https://{{ git_host }}:3000/lgtm/lgtm.git"
  revision: main
  helm_repo_url: "http://{{ nexus_host }}:8091/repository/lgtm-helm/"
  publish:
    git_push_url: "https://{{ git_host }}:3000/lgtm/lgtm.git"
    ca_file: "{{ repo_dir }}/lab/external/.generated/lab-ca.crt"   # Gitea's certificate (lab CA)
    username: lgtm
    password: "{{ lookup('password', secrets_dir + '/gitea_password chars=ascii_letters,digits length=20') }}"

# CA certificates the cluster trusts in addition to certs/ and the public CAs (paths on the Ansible host), e.g.
# a CA generated per site. Lab: the lab CA that signed Gitea's certificate (Argo CD and Grafana read Git).
trusted_ca_files: ["{{ repo_dir }}/lab/external/.generated/lab-ca.crt"]

# ---------------------------------------------------------------- Grafana Git Sync
# Dashboards and folders of every Grafana org live in a second Git repository, one directory per org
# (main/, <tenant>/). Grafana syncs it (Git Sync, pure Git over https) and commits what is saved in the UI;
# Argo CD and Ansible don't deploy dashboards. Lab: repository "grafana" on Gitea, seeded once from
# grafana/dashboards by lab/external.yml.
grafana_git_sync:
  url: "https://{{ git_host }}:3000/lgtm/grafana.git"
  branch: main
  token_user: lgtm
  token: "{{ lookup('file', secrets_dir + '/gitea_grafana_token') }}"   # written by lab/external.yml
  workflows: [write]       # UI saves commit to the branch; [branch]: via pull requests; []: read-only

# ---------------------------------------------------------------- tenants
# Loki, Mimir, Tempo and Pyroscope run multi-tenant: every write and query carries X-Scope-OrgID.
# Each tenant gets a Grafana organization of the same name whose datasources only see that tenant;
# Grafana's Main org sees all tenants (cross-tenant queries). Senders set the tenant themselves:
#   OTLP:      header X-Scope-OrgID=<tenant>   (e.g. OTEL_EXPORTER_OTLP_HEADERS)
#   profiles:  label tenant=<tenant>           (e.g. PYROSCOPE_LABELS); Alloy routes per tenant
#   pod logs:  tenant "platform" (set by Alloy)
# Adding a tenant: add it here, and add its pyroscope.relabel/write pair in k8s/values/alloy.yaml.
tenants:
  - name: demo                     # the demo shop
    # first content of the tenant's directory in Grafana's Git repository (lab/external.yml, from grafana/dashboards)
    dashboards: [lgtm-demo.json, order-journey.json, live-traffic.json]
  - name: platform                 # the cluster itself: pod logs (all namespaces except demo) and metrics
    dashboards: [cluster-health.json]

# ---------------------------------------------------------------- LAB ONLY: stand-in services (lab/external)
# Keycloak, Pebble (ACME CA), BIND (DNS), Gitea and Nexus run with docker compose on the Ansible host:
#   ansible-playbook -i lab/inventory lab/external.yml
lab_host_ip: 192.168.56.1          # the Ansible host on the lab network, reachable from the nodes
keycloak_version: 26.8.1
pebble_version: 2.10.1
gitea_version: 1.27.3
bind_version: "9.20"

# ---------------------------------------------------------------- TLS
# One certificate per hostname from the CA via ACME with External Account Binding (the CA hands out a key id +
# HMAC key) and the HTTP-01 challenge over port 80; cert-manager renews them (1/3 of the lifetime before expiry).
# Lab: CA = Pebble (lab/external), which resolves the hostnames via the lab DNS (BIND).
# Company: its ACME endpoint + EAB credentials (put secrets in ansible-vault).
tls_issuer:
  name: company-ca
  acme_server: "https://{{ lab_host_ip }}:14000/dir"     # ACME directory URL
  email: observability@example.corp                          # ACME account contact
  eab_kid: lgtm-observability                                # EAB key id issued by the CA
  eab_hmac_key: >-
    {{ lookup('password', secrets_dir + '/acme_eab_hmac_key chars=ascii_letters,digits length=64') }}
  # PEM of the CA that signed the ACME server's TLS certificate (path on the Ansible host, "" = public CA)
  ca_bundle_file: "{{ repo_dir }}/lab/external/.generated/pebble/acme-ca.crt"
  # Before asking the CA to validate, cert-manager fetches the challenge itself. The lab domain only exists
  # on the lab DNS, not in the cluster DNS, so cert-manager resolves the hostnames there.
  http01_check_nameservers: "{{ lab_host_ip }}:10053"

# ---------------------------------------------------------------- OAuth (Grafana, Argo CD <-> Keycloak)
# Users and groups live in the Keycloak realm (lab/templates/keycloak-realm.json.j2). One OAuth client each.
# Group -> Grafana org/role:  grafana-admins -> Grafana server admin + Admin in all orgs,
#                             tenant-<name>  -> Editor in the org of that tenant
# Group -> Argo CD role:      argocd-admins  -> role:admin  (everyone else: no access)
# Both still have their local admin as a fallback (Grafana: /login?disableAutoLogin=true).
oauth:
  enabled: true
  hostname: keycloak.company.org               # not under <domain>: runs on the Ansible host, not behind the VIP
  host_ip: "{{ lab_host_ip }}"            # optional: adds a hostAliases entry for hostname to Grafana's pods
  issuer: http://keycloak.company.org:8080/realms/lgtm
  client_id: grafana
  argocd_client_id: argocd
  argocd_admin_groups: [argocd-admins]
  # argocd_readonly_groups: [...]
oauth_client_secret: >-
  {{ lookup('password', secrets_dir + '/oauth_client_secret chars=ascii_letters,digits length=40') }}
argocd_oauth_client_secret: >-
  {{ lookup('password', secrets_dir + '/argocd_oauth_client_secret chars=ascii_letters,digits length=40') }}
keycloak_admin_password: >-
  {{ lookup('password', secrets_dir + '/keycloak_admin_password chars=ascii_letters,digits length=20') }}
# lab users of the realm (password files in .secrets/keycloak_user_<name>)
keycloak_users:
  - { name: admin-user, email: admin@example.corp, groups: [grafana-admins, argocd-admins] }
  - { name: alice, email: alice@example.corp, groups: [tenant-demo] }
  - { name: bob, email: bob@example.corp, groups: [tenant-platform] }
