# LAB site settings (Vagrant VMs on 192.168.56.0/24, stand-in services from lab/external/).
# Everything that differs between sites lives in the inventory; ansible/group_vars/all.yml only holds
# what is the same everywhere (versions, charts, generated secrets). Template for a real site:
# inventories/example/group_vars/all.yml.

# ---------------------------------------------------------------- network
# Two floating IPs (kube-vip, ARP), both move to a surviving node when one fails:
vip: 192.168.56.10            # Kubernetes API (6443) and RKE2 join (9345)
ingress_vip: 192.168.56.20    # every LGTM hostname -> Traefik, which routes by Host header
# Hostnames are <name>.<domain> (names in lgtm_hosts, ansible/group_vars/all.yml), all covered by one
# wildcard certificate *.<domain>. DNS: *.<domain> -> ingress_vip (lab: BIND in lab/external + /etc/hosts).
domain: lgtm.company.org
# Hostnames served on the ingress VIP (backends: ansible/templates/ingress.yaml.j2). Remove one to unpublish it.
lgtm_hosts: [grafana, loki, tempo, mimir, pyroscope, alloy, garage, argocd]

# ---------------------------------------------------------------- GitOps (Argo CD)
# Argo CD deploys from a Git repository (this repo) and a Helm repository (artifacts/charts). Lab: both on
# Gitea from lab/external; lgtm.yml pushes the committed HEAD and uploads the charts (gitops.publish).
gitops:
  repo_url: "http://{{ external_host_ip }}:3000/lgtm/lgtm.git"
  revision: main
  helm_repo_url: "http://{{ external_host_ip }}:3000/api/packages/lgtm/helm"
  publish:
    git_push_url: "http://{{ external_host_ip }}:3000/lgtm/lgtm.git"
    helm_upload_url: "http://{{ external_host_ip }}:3000/api/packages/lgtm/helm/api/charts"
    username: lgtm
    password: "{{ lookup('password', secrets_dir + '/gitea_password chars=ascii_letters,digits length=20') }}"

# ---------------------------------------------------------------- tenants
# Loki, Mimir, Tempo and Pyroscope run multi-tenant: every write and query carries X-Scope-OrgID.
# Each tenant gets a Grafana organization of the same name whose datasources only see that tenant;
# Grafana's Main org sees all tenants (cross-tenant queries). Senders set the tenant themselves:
#   OTLP:      header X-Scope-OrgID=<tenant>   (e.g. OTEL_EXPORTER_OTLP_HEADERS)
#   profiles:  label tenant=<tenant>           (e.g. PYROSCOPE_LABELS); Alloy routes per tenant
#   pod logs:  tenant "platform" (set by Alloy)
# Adding a tenant: add it here, and add its pyroscope.relabel/write pair in k8s/values/alloy.yaml.
tenants:
  - name: demo                     # the demo shop
    dashboards: [lgtm-demo.json]   # from k8s/dashboards, imported into the tenant's Grafana org
  - name: platform                 # the cluster itself: pod logs (all namespaces except demo) and metrics
    dashboards: [cluster-health.json]

# ---------------------------------------------------------------- services outside the cluster (external/)
# Keycloak (OAuth for Grafana) and Pebble (a small ACME server standing in for the company CA) run with
# docker-compose on the Ansible host: ansible-playbook -i lab/inventory lab/external.yml -K
external_host_ip: 192.168.56.1     # the Ansible host on the lab network, reachable from the nodes
keycloak_version: 26.8.1
pebble_version: 2.10.1
gitea_version: 1.27.3
bind_version: "9.20"

# ---------------------------------------------------------------- TLS
# One wildcard certificate *.<domain> (+ <domain>) from the CA via ACME with External Account Binding (the CA
# hands out a key id + HMAC key). Wildcards require the DNS-01 challenge: cert-manager writes the
# _acme-challenge TXT record with RFC2136 dynamic updates (TSIG key) into the DNS zone of <domain>.
# cert-manager renews automatically (default: 1/3 of the lifetime before expiry).
# Lab: CA = Pebble, DNS = BIND (both in lab/external). Company: its ACME endpoint + EAB credentials and the
# DNS server/TSIG key of the zone (put secrets in ansible-vault).
tls_issuer:
  name: company-ca
  acme_server: "https://{{ external_host_ip }}:14000/dir"     # ACME directory URL
  email: observability@example.corp                          # ACME account contact
  eab_kid: lgtm-observability                                # EAB key id issued by the CA
  eab_hmac_key: "{{ lookup('password', secrets_dir + '/acme_eab_hmac_key chars=ascii_letters,digits length=64') }}"
  # PEM of the CA that signed the ACME server's TLS certificate (path on the Ansible host, "" = public CA)
  ca_bundle_file: "{{ repo_dir }}/lab/external/.generated/pebble/acme-ca.crt"
  dns01:
    nameserver: "{{ external_host_ip }}:5353"     # authoritative for <domain>, accepts RFC2136 updates
    tsig_key_name: lgtm-acme
    tsig_algorithm: HMACSHA256
    tsig_secret: "{{ lookup('password', secrets_dir + '/dns_tsig_secret chars=ascii_letters,digits length=44') | b64encode }}"
    # cert-manager checks that the TXT record is visible before telling the CA; the lab zone isn't in
    # public DNS, so it asks the zone's server directly. Omit for a zone that public resolvers can see.
    recursive_nameservers: "{{ external_host_ip }}:5353"

# ---------------------------------------------------------------- OAuth (Grafana <-> Keycloak)
# Users and groups live in the Keycloak realm (lab/templates/keycloak-realm.json.j2).
# Group -> Grafana org/role:  grafana-admins -> Grafana server admin + Admin in all orgs,
#                             tenant-<name>  -> Editor in the org of that tenant
oauth:
  enabled: true
  hostname: keycloak.company.org               # not under <domain>: runs on the Ansible host, not behind the VIP
  host_ip: "{{ external_host_ip }}"            # optional: adds a hostAliases entry for hostname to Grafana's pods
  issuer: http://keycloak.company.org:8080/realms/lgtm
  client_id: grafana
oauth_client_secret: "{{ lookup('password', secrets_dir + '/oauth_client_secret chars=ascii_letters,digits length=40') }}"
keycloak_admin_password: "{{ lookup('password', secrets_dir + '/keycloak_admin_password chars=ascii_letters,digits length=20') }}"
# lab users of the realm (password files in .secrets/keycloak_user_<name>)
keycloak_users:
  - { name: admin-user, email: admin@example.corp, groups: [grafana-admins] }
  - { name: alice, email: alice@example.corp, groups: [tenant-demo] }
  - { name: bob, email: bob@example.corp, groups: [tenant-platform] }

