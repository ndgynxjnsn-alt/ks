# LAB ONLY: stand-ins for company services, on the Ansible host. Configs with secrets are rendered into
# .generated/ by   ansible-playbook -i lab/inventory lab/external.yml -K   (which also runs docker compose up).
#
#   keycloak  http://keycloak.company.org:8080   OAuth/OIDC for Grafana (realm "lgtm", client "grafana")
#   pebble    https://192.168.56.1:14000/dir     ACME server with External Account Binding (the "company CA")
#   bind      192.168.56.1:10053 (udp+tcp)       authoritative DNS for lgtm.company.org: *.lgtm.company.org
#                                                -> ingress VIP (Pebble resolves the hosts for HTTP-01 here)
#   gitea     https://192.168.56.1:3000          Git repositories: this one (Argo CD) and Grafana's (Git Sync)
#   nexus     http://192.168.56.1:8091           Sonatype Nexus: Helm repository (UI/API), Docker registry on :8092
name: lgtm-external

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]   # imports .generated/keycloak/*.json if the realm doesn't exist
    env_file: ./.generated/keycloak.env        # KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD
    environment:
      KC_HOSTNAME: http://keycloak.company.org:8080   # one issuer URL for browsers and for Grafana
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./.generated/keycloak:/opt/keycloak/data/import:ro"]
    restart: unless-stopped

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    # HTTP-01: Pebble resolves <name>.lgtm.company.org on the lab DNS server (-> ingress VIP)
    command: ["-config", "/config/pebble-config.json", "-dnsserver", "bind:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"                   # validate challenges immediately
      PEBBLE_WFE_NONCEREJECT: "0"              # don't reject nonces at random (Pebble's default chaos)
    ports:
      - "14000:14000"                          # ACME API (TLS cert from .generated/pebble/acme.crt)
      - "15000:15000"                          # management: /roots/0 = root of the issued certificates
    volumes: ["./.generated/pebble:/config:ro"]
    depends_on: [bind]
    restart: unless-stopped

  bind:
    image: internetsystemsconsortium/bind9:9.20
    command: ["-g", "-c", "/etc/bind/named.conf"]   # foreground, log to stderr
    ports:
      - "10053:53/udp"                          # 53: libvirt dnsmasq on the lab bridge, 5353: mDNS (avahi)
      - "10053:53/tcp"
    volumes:
      - ./.generated/bind/named.conf:/etc/bind/named.conf:ro
      - ./.generated/bind/zones:/var/lib/bind  # writable: dynamic updates + journal
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.27.3-rootless
    environment:
      GITEA__security__INSTALL_LOCK: "true"                       # no web installer
      GITEA__server__ROOT_URL: https://192.168.56.1:3000/
      GITEA__server__PROTOCOL: https                              # Grafana's Git Sync only speaks https
      GITEA__server__CERT_FILE: /etc/gitea-tls/tls.crt            # signed by the lab CA (lab/external.yml)
      GITEA__server__KEY_FILE: /etc/gitea-tls/tls.key
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"          # first push creates the repo
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: "false"     # Argo CD reads anonymously
    ports: ["3000:3000"]
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - ./.generated/gitea:/etc/gitea-tls:ro
    restart: unless-stopped

  # The company's artifact repository: container images (Docker hosted repository "lgtm-docker", own HTTP
  # connector on 8082) and Helm charts (hosted repository "lgtm-helm"). Set up by lab/external.yml.
  # 8081 on the host is taken by the shop example (examples/), hence 8091/8092.
  nexus:
    image: sonatype/nexus3:3.98.0
    environment:
      # default heap is ~2.7 GB; the lab holds ~50 images and ~15 charts
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    ports:
      - "8091:8081"                            # UI, REST API, Helm repository
      - "8092:8082"                            # Docker registry API of repository lgtm-docker
    volumes: [nexus-data:/nexus-data]
    restart: unless-stopped

volumes:
  nexus-data:
  gitea-data:
  gitea-config:
