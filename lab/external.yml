# LAB ONLY: stand-ins for company services, on the Ansible host (lab/external/docker-compose.yml):
#   Keycloak - OAuth/OIDC for Grafana        Pebble - ACME server with External Account Binding (lab CA)
#   BIND     - DNS zone of the domain, RFC2136 updates for the DNS-01 challenge
#   Gitea    - Git + Helm repository for Argo CD
# Renders their configs (with secrets) into lab/external/.generated/ and starts them with sudo docker compose.
#   ansible-playbook -i lab/inventory lab/external.yml   (add -e lab_docker_sudo=true -K without docker group)
- name: External services (Keycloak, Pebble)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../ansible/group_vars/all.yml]   # shared paths and generated secrets
  vars:
    gen: "{{ repo_dir }}/lab/external/.generated"
  tasks:
    - name: Directories for generated configs
      ansible.builtin.file: { path: "{{ gen }}/{{ item }}", state: directory, mode: "0750" }
      loop: [keycloak, pebble, bind]

    - name: Writable zone directory (named runs as user bind in the container)
      ansible.builtin.file: { path: "{{ gen }}/bind/zones", state: directory, mode: "0777" }

    - name: BIND configuration (zone + TSIG key)
      ansible.builtin.template: { src: templates/named.conf.j2, dest: "{{ gen }}/bind/named.conf", mode: "0644" }
      notify: Restart bind

    - name: Zone seed (only once; BIND owns the zone afterwards)
      ansible.builtin.template:
        src: templates/zone.j2
        dest: "{{ gen }}/bind/zones/{{ domain }}.zone"
        mode: "0666"
        force: false

    # Pebble's ACME API speaks TLS. cert-manager reaches it by IP, so the certificate needs an IP SAN; the CA
    # below is what tls_issuer.ca_bundle_file points to.
    - name: CA and TLS certificate for the ACME endpoint
      ansible.builtin.shell:
        cmd: |
          set -e
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=LGTM lab ACME endpoint CA" \
            -keyout acme-ca.key -out acme-ca.crt 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN={{ external_host_ip }}" \
            -keyout acme.key -out acme.csr 2>/dev/null
          printf 'subjectAltName=IP:%s,DNS:acme.org,DNS:localhost\nextendedKeyUsage=serverAuth\n' \
            "{{ external_host_ip }}" > acme.ext
          openssl x509 -req -in acme.csr -CA acme-ca.crt -CAkey acme-ca.key -CAcreateserial -days 3650 \
            -extfile acme.ext -out acme.crt 2>/dev/null
          chmod 0644 acme.key acme.crt acme-ca.crt   # read by the pebble container user
          rm -f acme.csr acme.ext
        chdir: "{{ gen }}/pebble"
        creates: "{{ gen }}/pebble/acme.crt"

    - name: Pebble configuration (EAB key id + HMAC key from tls_issuer)
      ansible.builtin.template:
        src: templates/pebble-config.json.j2
        dest: "{{ gen }}/pebble/pebble-config.json"
        mode: "0644"
      notify: Restart pebble

    - name: Keycloak realm (client, groups, users)
      ansible.builtin.template:
        src: templates/keycloak-realm.json.j2
        dest: "{{ gen }}/keycloak/lgtm-realm.json"
        mode: "0644"

    - name: Keycloak admin credentials
      ansible.builtin.copy:
        dest: "{{ gen }}/keycloak.env"
        mode: "0600"
        content: |
          KC_BOOTSTRAP_ADMIN_USERNAME=admin
          KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password }}

    - name: Start the containers
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ repo_dir }}/lab/external"
      become: "{{ lab_docker_sudo | default(false) }}"
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr or 'Created' in compose.stderr"

    - name: Wait for Gitea
      ansible.builtin.uri: { url: "http://127.0.0.1:3000/api/healthz" }
      register: gitea_health
      until: gitea_health.status == 200
      retries: 30
      delay: 5

    - name: Gitea user owning the repository and the Helm charts
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, gitea, gitea, admin, user, create, --admin, --username,
               "{{ gitops.publish.username }}", --password, "{{ gitops.publish.password }}",
               --email, "{{ gitops.publish.username }}@example.corp", --must-change-password=false]
        chdir: "{{ repo_dir }}/lab/external"
      become: "{{ lab_docker_sudo | default(false) }}"
      register: gitea_user
      changed_when: gitea_user.rc == 0
      failed_when: gitea_user.rc != 0 and 'already exists' not in gitea_user.stderr + gitea_user.stdout
      no_log: true

    - name: Next steps
      vars:
        lgtm_fqdns: "{{ lgtm_hosts | map('regex_replace', '$', '.' ~ domain) | list }}"
      ansible.builtin.debug:
        msg:
          - "/etc/hosts on this machine:  {{ external_host_ip }} {{ oauth.hostname }}"
          - "                             {{ ingress_vip }} {{ lgtm_fqdns | join(' ') }}"
          - "(or use the lab DNS: dig @{{ external_host_ip }} -p 10053 grafana.{{ domain }})"
          - "Keycloak admin console: http://{{ oauth.hostname }}:8080/admin  (admin / .secrets/keycloak_admin_password)"
          - "Lab users: {{ keycloak_users | map(attribute='name') | join(', ') }}"
          - "  passwords: .secrets/keycloak_user_<name>"
          - "Then: ansible-playbook -i lab/inventory ansible/lgtm.yml"

  # the realm is only imported when it doesn't exist; config changes of Pebble/BIND need a restart
  handlers:
    - name: Restart pebble
      ansible.builtin.command:
        cmd: docker compose restart pebble
        chdir: "{{ repo_dir }}/lab/external"
      become: "{{ lab_docker_sudo | default(false) }}"
      changed_when: true

    - name: Restart bind
      ansible.builtin.command:
        cmd: docker compose restart bind
        chdir: "{{ repo_dir }}/lab/external"
      become: "{{ lab_docker_sudo | default(false) }}"
      changed_when: true
