# Keycloak imports the realm file only when the realm doesn't exist yet. This keeps an existing realm in step
# with lab/templates/keycloak-realm.json.j2 through the admin API: clients are overwritten (new clients,
# changed redirect URIs/secrets/mappers), missing realm roles and users are added (existing users are kept, so
# their ids and the logins linked to them stay), every user gets exactly the realm roles the inventory lists
# for it, and groups (no longer used for access) are removed.
- name: Keycloak admin API
  vars:
    kc: http://127.0.0.1:8080
    realm: "{{ lookup('template', 'templates/keycloak-realm.json.j2') | from_json }}"
  block:
    - name: Wait for Keycloak
      ansible.builtin.uri: { url: "{{ kc }}/realms/master" }
      register: kc_up
      until: kc_up.status == 200
      retries: 60
      delay: 5

    - name: Admin token
      ansible.builtin.uri:
        url: "{{ kc }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: admin
          password: "{{ keycloak_admin_password }}"
      register: kc_token
      no_log: true

    - name: Realm roles (only missing ones)
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/roles"
        method: POST
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
        body_format: json
        body: "{{ item }}"
        status_code: [201, 409]
      loop: "{{ realm.roles.realm }}"
      loop_control: { label: "{{ item.name }}" }
      register: kc_role_add
      changed_when: kc_role_add.status == 201

    - name: Clients (overwritten), users (only missing ones; memberships below)
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/partialImport"
        method: POST
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
        body_format: json
        body: "{{ {'ifResourceExists': item.policy} | combine(item.resources) }}"
      loop:
        - { policy: OVERWRITE, resources: { clients: "{{ realm.clients }}" } }
        - policy: SKIP
          resources: { users: "{{ realm.users | map('ansible.utils.remove_keys', target=['realmRoles']) }}" }
      loop_control: { label: "{{ item.resources.keys() | join(', ') }}" }
      register: kc_import
      changed_when: kc_import.json.added | int > 0
      no_log: true

    - name: Groups of the realm
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/groups"
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
      register: kc_groups

    - name: Remove groups (access is by realm roles)
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/groups/{{ item.id }}"
        method: DELETE
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
        status_code: 204
      loop: "{{ kc_groups.json }}"
      loop_control: { label: "{{ item.name }}" }
      changed_when: true

    - name: Realm roles of the realm
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/roles"
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
      register: kc_roles

    - name: Users of the realm
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/users?max=1000"
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
      register: kc_users

    - name: Current realm roles of each user
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/users/{{ user_id }}/role-mappings/realm"
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
      vars:
        user_id: "{{ (kc_users.json | selectattr('username', 'equalto', item.name) | first).id }}"
      loop: "{{ keycloak_users }}"
      loop_control: { label: "{{ item.name }}" }
      register: kc_user_roles

    # Only the managed roles (realm.roles) are touched; Keycloak's own (default-roles-*, ...) stay.
    - name: Realm roles from the inventory (add missing, remove the others)
      ansible.builtin.uri:
        url: "{{ kc }}/admin/realms/{{ realm.realm }}/users/{{ user_id }}/role-mappings/realm"
        method: "{{ item.method }}"
        headers: { Authorization: "Bearer {{ kc_token.json.access_token }}" }
        body_format: json
        body: "{{ kc_roles.json | selectattr('name', 'in', item.roles) | list }}"
        status_code: 204
      vars:
        user_id: "{{ (kc_users.json | selectattr('username', 'equalto', item.user) | first).id }}"
      loop: >-
        {%- set out = [] -%}
        {%- set managed = realm.roles.realm | map(attribute='name') | list -%}
        {%- for r in kc_user_roles.results -%}
        {%-   set has = r.json | map(attribute='name') | select('in', managed) | list -%}
        {%-   set add = r.item.roles | reject('in', has) | list -%}
        {%-   set remove = has | reject('in', r.item.roles) | list -%}
        {%-   if add -%}{%- set _ = out.append({'user': r.item.name, 'method': 'POST', 'roles': add}) -%}{%- endif -%}
        {%-   if remove -%}
        {%-     set _ = out.append({'user': r.item.name, 'method': 'DELETE', 'roles': remove}) -%}
        {%-   endif -%}
        {%- endfor -%}{{ out }}
      loop_control: { label: "{{ item.user }}: {{ item.method }} {{ item.roles | join(', ') }}" }
      changed_when: true
