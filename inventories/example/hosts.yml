# Template for a real site: copy inventories/example to inventories/<site> and fill in the servers.
# Run:  ansible-playbook -i inventories/<site> ansible/site.yml   (and lgtm.yml, ...)
all:
  children:
    nodes:                       # exactly the servers of the cluster (3 for an HA control plane)
      hosts:
        # topolvm_disk: whole empty disk for TopoLVM, a name in /dev/disk/by-id of THAT server (the fastest one;
        # Garage takes the other empty disks). List and compare: ansible-playbook ... ansible/disks.yml
        server1: { ansible_host: 10.0.10.11, topolvm_disk: nvme-CHANGE-ME }
        server2: { ansible_host: 10.0.10.12, topolvm_disk: nvme-CHANGE-ME }
        server3: { ansible_host: 10.0.10.13, topolvm_disk: nvme-CHANGE-ME }
      vars:
        ansible_user: ops
        ansible_password: "{{ vault_ops_password }}"          # ansible-vault, or use SSH keys instead
        ansible_become_password: "{{ vault_ops_password }}"
