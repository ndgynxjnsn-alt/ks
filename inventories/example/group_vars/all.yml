# Site settings of a real environment (everything here is required). The lab equivalent with working
# values is lab/inventory/group_vars/all.yml. Keep secrets in ansible-vault (vault_* variables).

# ---------------------------------------------------------------- network
vip: 10.0.10.10            # free IP in the servers' subnet: Kubernetes API (6443) + RKE2 join (9345)
ingress_vip: 10.0.10.20    # free IP in the same subnet: all LGTM hostnames (Traefik)
domain: lgtm.company.org   # DNS: *.lgtm.company.org -> ingress_vip
lgtm_hosts: [grafana, loki, tempo, mimir, pyroscope, alloy, garage, argocd, headlamp, faro, pgbackweb]
grafana_db_external: true   # Grafana's PostgreSQL on <ingress_vip>:5432 (postgres.<domain>), TLS + password

# ---------------------------------------------------------------- storage
# topolvm_disk is set per host in hosts.yml (the disks differ between servers); ansible/disks.yml suggests one.

# ---------------------------------------------------------------- company services
nexus_host: nexus.company.org     # artifact repository (Docker registry + Helm repository)
git_host: git.company.org         # Git server: this repository (Argo CD) and Grafana's dashboards (Git Sync)

# ---------------------------------------------------------------- artifact repository
# ansible/publish.yml pushes artifacts/ there; the nodes pull every image through it (containerd mirrors),
# Argo CD reads the charts from it.
registry:
  host: "{{ nexus_host }}:5000"            # Docker API of the hosted Docker repository (Nexus: its HTTP(S) connector)
  # ca_file: "{{ repo_dir }}/certs/company-root.crt"   # if its certificate isn't publicly trusted
  # username / password                    # pull credentials, if anonymous read is off
  publish:
    helm_upload_url: "https://{{ nexus_host }}/repository/lgtm-helm/"
    username: lgtm-publisher
    password: "{{ vault_nexus_password }}"

# ---------------------------------------------------------------- GitOps (Argo CD)
gitops:
  repo_url: "https://{{ git_host }}/observability/lgtm.git"
  revision: main
  helm_repo_url: "https://{{ nexus_host }}/repository/lgtm-helm/"
  repo_username: argocd                               # optional: read access for Argo CD
  repo_password: "{{ vault_git_token }}"
  # helm_username / helm_password: optional
  # publish: {...}                                    # optional: let lgtm.yml push (see lab inventory)

# trusted_ca_files: []    # CAs to trust that are not in certs/ (paths on the Ansible host)

# ---------------------------------------------------------------- Grafana Git Sync
# Dashboards per Grafana org (directories main/, <tenant>/) in their own repository; Grafana commits UI saves.
grafana_git_sync:
  url: "https://{{ git_host }}/observability/grafana-dashboards.git"
  branch: main
  token_user: grafana-git-sync                        # owner of the token (write access to the repository)
  token: "{{ vault_grafana_git_token }}"
  workflows: [write]

# ---------------------------------------------------------------- tenants
tenants:
  - name: platform               # the cluster itself: pod logs and metrics (Alloy)
    dashboards: [cluster-health.json]

# ---------------------------------------------------------------- TLS: company CA (ACME + EAB, HTTP-01)
tls_issuer:
  name: company-ca
  acme_server: https://ca.company.org/acme/directory
  email: observability@company.org
  eab_kid: "{{ vault_acme_eab_kid }}"
  eab_hmac_key: "{{ vault_acme_eab_hmac_key }}"
  ca_bundle_file: ""                       # "" if the ACME endpoint has a publicly trusted certificate
  # http01_check_nameservers: 10.0.0.53:53 # only if the cluster DNS can't resolve <domain>

# ---------------------------------------------------------------- OAuth: company IdP (OIDC)
oauth:
  enabled: true
  hostname: sso.company.org
  issuer: https://sso.company.org/realms/company
  client_id: grafana-lgtm                 # OAuth client of Grafana
  argocd_client_id: argocd-lgtm           # a second client for Argo CD (redirect https://argocd.<domain>/auth/callback)
  argocd_admin_groups: [lgtm-admins]      # IdP groups (claim "groups") -> Argo CD role:admin
oauth_client_secret: "{{ vault_oauth_client_secret }}"
argocd_oauth_client_secret: "{{ vault_argocd_oauth_client_secret }}"
