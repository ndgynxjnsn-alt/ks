# Site settings of a real environment (everything here is required). The lab equivalent with working
# values is lab/inventory/group_vars/all.yml. Keep secrets in ansible-vault (vault_* variables).

# ---------------------------------------------------------------- network
vip: 10.0.10.10            # free IP in the servers' subnet: Kubernetes API (6443) + RKE2 join (9345)
ingress_vip: 10.0.10.20    # free IP in the same subnet: all LGTM hostnames (Traefik)
domain: lgtm.company.org   # DNS: *.lgtm.company.org -> ingress_vip
lgtm_hosts: [grafana, loki, tempo, mimir, pyroscope, alloy, garage, argocd]

# ---------------------------------------------------------------- GitOps (Argo CD)
# Argo CD deploys from a Git repository (this repo) and a Helm repository (artifacts/charts), both on Gitea on the
# Ansible host (ansible/gitea.yml); lgtm.yml pushes the committed HEAD and uploads the charts (gitops.publish).
# Plain http with anonymous read: keep port 3000 reachable from the servers only. The repository holds no secrets.
gitea_url: http://10.0.10.5:3000   # address of the Ansible host as seen from the servers
gitops:
  repo_url: "{{ gitea_url }}/lgtm/lgtm.git"
  revision: main
  helm_repo_url: "{{ gitea_url }}/api/packages/lgtm/helm"
  publish:
    git_push_url: "{{ gitea_url }}/lgtm/lgtm.git"
    helm_upload_url: "{{ gitea_url }}/api/packages/lgtm/helm/api/charts"
    username: lgtm
    password: "{{ lookup('password', secrets_dir + '/gitea_password chars=ascii_letters,digits length=20') }}"

# ---------------------------------------------------------------- tenants
tenants:
  - name: platform               # the cluster itself: pod logs and metrics (Alloy)
    dashboards: [cluster-health.json]

# ---------------------------------------------------------------- TLS: company CA (ACME + EAB, HTTP-01)
tls_issuer:
  name: company-ca
  acme_server: https://ca.company.org/acme/directory
  email: observability@company.org
  eab_kid: "{{ vault_acme_eab_kid }}"
  eab_hmac_key: "{{ vault_acme_eab_hmac_key }}"
  ca_bundle_file: ""                       # "" if the ACME endpoint has a publicly trusted certificate
  # http01_check_nameservers: 10.0.0.53:53 # only if the cluster DNS can't resolve <domain>

# ---------------------------------------------------------------- OAuth: company IdP (OIDC)
oauth:
  enabled: true
  hostname: sso.company.org
  issuer: https://sso.company.org/realms/company
  client_id: grafana-lgtm
oauth_client_secret: "{{ vault_oauth_client_secret }}"
