{{- /* One Application per entry in .Values.apps. Child apps sync automatically (prune + self-heal);
       the root app waits for each wave's Applications to be healthy (health check in argocd-cm). */ -}}
{{- $repo := .Values.site.repo | default dict }}
{{- range $name, $app := .Values.apps }}
{{- $values := dict }}
{{- with $app.siteValues }}
{{- $values = include (printf "lgtm.values.%s" .) $ | fromYaml }}
{{- if hasKey $values "Error" }}{{ fail (printf "apps.%s: %s" $name $values.Error) }}{{ end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | default 0 | quote }}
  {{- if ne $name "argocd" }}
  finalizers: [resources-finalizer.argocd.argoproj.io]
  {{- end }}
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace | default "lgtm" }}
  {{- if $app.path }}
  source:
    repoURL: {{ required "site.repo.git" $repo.git }}
    targetRevision: {{ $repo.revision | default "main" }}
    path: {{ $app.path }}
    {{- with $values }}
    helm:
      valuesObject:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- else }}
  {{- $chart := $app.chart | default $name }}
  {{- $version := "" }}
  {{- if eq $chart "mimir-distributed" }}
  {{- $version = $.Values.mimir_chart.version }}
  {{- else }}
  {{- $version = (required (printf "settings.yaml: charts.%s" $chart) (index $.Values.charts $chart)).version }}
  {{- end }}
  sources:
    - repoURL: {{ required "site.repo.helm" $repo.helm }}
      chart: {{ $chart }}
      targetRevision: {{ $version | quote }}
      helm:
        releaseName: {{ $name }}
        valueFiles: ["$values/k8s/values/{{ $name }}.yaml"]
        {{- with $values }}
        valuesObject:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    - repoURL: {{ $repo.git }}
      targetRevision: {{ $repo.revision | default "main" }}
      ref: values
    {{- with $app.extraPath }}
    - repoURL: {{ $repo.git }}             # additional manifests/Kustomize from this repository
      targetRevision: {{ $repo.revision | default "main" }}
      path: {{ . }}
    {{- end }}
  {{- end }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                    # large CRDs (cert-manager, CloudNativePG)
      - SkipDryRunOnMissingResource=true        # CRs whose CRD arrives in the same wave
    retry:
      limit: 20
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
{{- end }}
