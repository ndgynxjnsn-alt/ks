{{- /* PostgreSQL for Grafana, run by CloudNativePG: one primary + streaming replicas on different nodes;
       on primary failure the operator promotes a replica and moves the -rw Service to it.
       Credentials: Secret grafana-db-app (generated by the operator).
       External access (.Values.grafanaDB.external): port 5432 of the ingress VIP -> Traefik's TCP entrypoint
       "postgres" -> the primary (grafana-db-rw). Postgres negotiates TLS inside its own protocol, so Traefik
       passes the connection through untouched (HostSNI(`*`)): one database per port, no routing by hostname.
       The server certificate (CA in Secret grafana-db-ca) also names postgres.<domain>, for sslmode=verify-full.
       Backups: the Barman Cloud plugin archives every WAL segment and takes a daily base backup into the Garage
       bucket grafana-db-backups, kept .Values.grafanaDB.backup.retention (point-in-time recovery into a new
       cluster, see README). Role + database "pgbackweb" hold PG Back Web's own data (pgbackweb.yaml). */ -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: lgtm
spec:
  instances: {{ .Values.grafanaDB.instances }}
  imageName: {{ .Values.grafanaDB.image }}
  imagePullPolicy: IfNotPresent
  storage:
    size: {{ .Values.grafanaDB.size }}      # TopoLVM (default StorageClass)
  {{- if .Values.grafanaDB.external }}
  certificates:
    serverAltDNSNames: ["postgres.{{ .Values.domain }}"]
  {{- end }}
  bootstrap:
    initdb: { database: grafana, owner: grafana }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true                         # (the operator's defaults, spelled out so Argo CD sees no drift)
      isWALArchiver: true
      parameters: { barmanObjectName: grafana-db-backups }
  managed:
    roles:
      - name: pgbackweb
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret: { name: pgbackweb-db }    # created by Ansible
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: grafana-db-backups
  namespace: lgtm
spec:
  retentionPolicy: {{ .Values.grafanaDB.backup.retention | quote }}
  configuration:
    destinationPath: s3://grafana-db-backups/
    endpointURL: http://{{ .Values.s3Endpoint }}
    s3Credentials:
      accessKeyId: { name: s3-credentials, key: S3_ACCESS_KEY_ID }
      secretAccessKey: { name: s3-credentials, key: S3_SECRET_ACCESS_KEY }
      region: { name: s3-credentials, key: S3_REGION }
    wal: { compression: gzip }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-db-daily
  namespace: lgtm
spec:
  schedule: {{ .Values.grafanaDB.backup.schedule | quote }}   # seconds minutes hours day month weekday
  immediate: true                         # first base backup right away
  backupOwnerReference: self
  cluster: { name: grafana-db }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana-db-pgbackweb
  namespace: lgtm
spec:
  cluster: { name: grafana-db }
  name: pgbackweb
  owner: pgbackweb
{{- if .Values.grafanaDB.external }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: grafana-db
  namespace: lgtm
  annotations:
    kubernetes.io/ingress.class: traefik   # RKE2's Traefik only reads CRD objects of its class
spec:
  entryPoints: [postgres]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: grafana-db-rw, port: 5432 }]
{{- end }}
