{{- /* PostgreSQL for Grafana, run by CloudNativePG: one primary + streaming replicas on different nodes;
       on primary failure the operator promotes a replica and moves the -rw Service to it.
       Credentials: Secret grafana-db-app (generated by the operator).
       External access (.Values.grafanaDB.external): port 5432 of the ingress VIP -> Traefik's TCP entrypoint
       "postgres" -> the primary (grafana-db-rw). Postgres negotiates TLS inside its own protocol, so Traefik
       passes the connection through untouched (HostSNI(`*`)): one database per port, no routing by hostname.
       The server certificate (CA in Secret grafana-db-ca) also names postgres.<domain>, for sslmode=verify-full. */ -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: lgtm
spec:
  instances: {{ .Values.grafanaDB.instances }}
  imageName: {{ .Values.grafanaDB.image }}
  imagePullPolicy: IfNotPresent
  storage:
    size: {{ .Values.grafanaDB.size }}      # TopoLVM (default StorageClass)
  {{- if .Values.grafanaDB.external }}
  certificates:
    serverAltDNSNames: ["postgres.{{ .Values.domain }}"]
  {{- end }}
  bootstrap:
    initdb: { database: grafana, owner: grafana }
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
{{- if .Values.grafanaDB.external }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: grafana-db
  namespace: lgtm
spec:
  entryPoints: [postgres]
  routes:
    - match: HostSNI(`*`)
      services: [{ name: grafana-db-rw, port: 5432 }]
{{- end }}
