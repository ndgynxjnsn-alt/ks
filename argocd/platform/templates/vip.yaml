{{- /* The floating IP for everything LGTM: one LoadBalancer Service (kube-vip, address from the annotation)
       in front of Traefik, which routes *.<domain> by Host header. externalTrafficPolicy Local: the Traefik
       pod on the node that holds the IP serves the traffic. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: vip-ingress
  namespace: kube-system
  annotations:
    kube-vip.io/loadbalancerIPs: {{ .Values.ingressVIP | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {{ toJson .Values.traefikSelector }}
  ports:
    - { name: web, port: 80, targetPort: web }
    - { name: websecure, port: 443, targetPort: websecure }
---
# Garage runs on the nodes, outside Kubernetes. This hostNetwork DaemonSet (a pause container, one pod per node)
# gives the Service "garage" endpoints with the node IPs, and its readiness probe on Garage's S3 port takes a
# node out of the endpoints while its Garage is down. (Argo CD ignores hand-written EndpointSlices.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: garage-endpoint
  namespace: lgtm
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: garage-endpoint }
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage-endpoint }
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations: [{ operator: Exists }]
      containers:
        - name: pause
          image: {{ .Values.garageEndpointImage }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: s3, containerPort: 3900 }]
          readinessProbe:
            tcpSocket: { port: 3900 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: lgtm
spec:
  selector: { app.kubernetes.io/name: garage-endpoint }
  ports:
    - { name: s3, port: 3900, targetPort: 3900 }
