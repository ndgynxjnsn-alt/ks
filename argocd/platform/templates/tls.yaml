{{- /* The company CA as certificate issuer: ACME with External Account Binding (the CA hands out a key id + HMAC
       key; only that external account gets certificates). Challenge HTTP-01: the CA fetches a token from
       http://<host>/.well-known/acme-challenge/, which cert-manager serves through a temporary Traefik route.
       Every https Ingress requests its own certificate (templates/ingress.yaml). The EAB HMAC key is a Secret
       created by Ansible. */ -}}
{{- with .Values.tls }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .issuer }}
spec:
  acme:
    server: {{ .acmeServer }}
    email: {{ .email }}
    {{- if .caBundle }}
    caBundle: {{ .caBundle }}     # CA of the ACME server's own TLS certificate
    {{- end }}
    externalAccountBinding:
      keyID: {{ .eabKeyID }}
      keySecretRef: { name: {{ .issuer }}-eab, key: hmac-key }
    privateKeySecretRef: { name: {{ .issuer }}-acme-account }
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
