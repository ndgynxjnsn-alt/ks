# Set by the root app (ansible/lgtm.yml renders them from the inventory); defaults for reference.
domain: lgtm.company.org
ingressVIP: ""               # floating IP of Traefik (kube-vip)
hosts: []                    # published hostnames <name>.<domain>, see templates/ingress.yaml
# pause image (part of RKE2's air-gap images) for the garage-endpoint DaemonSet
garageEndpointImage: docker.io/rancher/mirrored-pause:3.10.2
traefikSelector: { app.kubernetes.io/name: rke2-traefik }
tls:
  issuer: company-ca
  acmeServer: ""
  email: ""
  eabKeyID: ""               # the EAB HMAC key is the Secret <issuer>-eab (created by Ansible)
  caBundle: ""               # base64 PEM of the ACME server's CA ("" = publicly trusted)
grafanaDB:
  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 3
  size: 1Gi
