# Demo shop: "shop" generates load and calls "inventory". Both send all telemetry to Alloy:
#   OTel Java agent  -> OTLP traces, metrics (with exemplars), logs (with trace ids) -> alloy:4318
#   Pyroscope agent  -> CPU/alloc/lock profiles; the pyroscope-otel extension labels
#                       them with the active span (span_id, span_name)              -> alloy:9999
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: shop }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop }
    spec:
      containers:
        - name: app
          image: lgtm.local/demo:1.0.0
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: telemetry } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: OTEL_SERVICE_NAME, value: shop }
            - { name: PYROSCOPE_APPLICATION_NAME, value: shop }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment.name=lab,\
                k8s.namespace.name=demo,k8s.pod.name=$(POD_NAME)"
            - { name: DEMO_INVENTORY_URL, value: http://inventory.demo.svc:8080 }
            - { name: DEMO_LOAD_ENABLED, value: "true" }
            - { name: DEMO_LOAD_TARGET_URL, value: http://shop.demo.svc:8080 }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: inventory }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inventory }
    spec:
      containers:
        - name: app
          image: lgtm.local/demo:1.0.0
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: telemetry } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: OTEL_SERVICE_NAME, value: inventory }
            - { name: PYROSCOPE_APPLICATION_NAME, value: inventory }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment.name=lab,\
                k8s.namespace.name=demo,k8s.pod.name=$(POD_NAME)"
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: demo
spec:
  selector: { app.kubernetes.io/name: shop }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector: { app.kubernetes.io/name: inventory }
  ports: [{ name: http, port: 8080, targetPort: http }]
