# Traefik ingress for every UI/API. Hostnames resolve to the kube-vip VIP (see README: /etc/hosts).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: lgtm
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: grafana, port: { number: 80 } } }
