# Argo CD: installed once by ansible/lgtm.yml (Helm), then manages everything else from Git
# (app of apps: argocd/root). UI at argocd.<domain> via Traefik, so the server runs without TLS itself.
fullnameOverride: argocd
dex: { enabled: false }
notifications: { enabled: false }
configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # resource.customizations.health.argoproj.io_Application: k8s/argocd/application-health.lua (--set-file)
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
repoServer:
  # Trusted CAs for https Git and Helm repositories: the bundle trust-manager builds from certs/ (+ public
  # CAs). git and helm run as subprocesses and read the file on every call, so changes need no restart.
  volumes:
    - name: company-ca
      configMap: { name: company-ca-bundle, optional: true }
  volumeMounts:
    - { name: company-ca, mountPath: /etc/ssl/company, readOnly: true }
  env:
    - { name: SSL_CERT_FILE, value: /etc/ssl/company/ca-certificates.crt }
    - { name: GIT_SSL_CAINFO, value: /etc/ssl/company/ca-certificates.crt }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
