# Grafana Alloy as DaemonSet: the single entry point for telemetry. The pipeline configuration is
# k8s/alloy/config.alloy, the OTLP/JSON import sidecar k8s/alloy/otlp-json-import.sh.
fullnameOverride: alloy

alloy:
  enableReporting: false
  mounts:
    varlog: true
    extra:
      - { name: otel-import, mountPath: /otel-import, readOnly: true }
      # host filesystems for the node exporter (prometheus.exporter.unix)
      - { name: host-root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
      - { name: host-proc, mountPath: /host/proc, readOnly: true }
      - { name: host-sys, mountPath: /host/sys, readOnly: true }
      # trusted CAs (certs/ + public CAs, trust-manager): tls_config { ca_file = "/etc/ssl/company/ca-certificates.crt" }
      - { name: company-ca, mountPath: /etc/ssl/company, readOnly: true }
  extraEnv:
    - name: NODE_IP                          # etcd and Garage metrics are scraped on the node's address
      valueFrom: { fieldRef: { fieldPath: status.hostIP } }
    - name: GARAGE_METRICS_TOKEN             # Garage's metrics_token (Secret created by ansible/lgtm.yml)
      valueFrom: { secretKeyRef: { name: garage-metrics, key: token } }
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
    - { name: profiles, port: 9999, targetPort: 9999, protocol: TCP }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }     # the node tailing the most pod logs reached ~350 Mi
  configMap:                   # k8s/alloy/config.alloy (ConfigMap from k8s/alloy/kustomization.yaml)
    create: false
    name: alloy-config
    key: config.alloy

# Plain tag instead of the chart's tag@index-digest: offline nodes only hold the amd64 image, whose
# digest differs from the multi-arch index digest, so a digest reference would never match locally.
configReloader:
  image:
    tag: v0.94.0

controller:
  volumes:
    extra:
      - name: otel-import
        hostPath: { path: /var/lib/otel-import, type: DirectoryOrCreate }
      - { name: host-root, hostPath: { path: / } }
      - { name: host-proc, hostPath: { path: /proc } }
      - { name: host-sys, hostPath: { path: /sys } }
      - { name: alloy-config, configMap: { name: alloy-config } }
      - { name: company-ca, configMap: { name: company-ca-bundle, optional: true } }
  # Imports OTLP/JSON files (one export request per line, as written by the OTel Collector's file exporter,
  # or a single pretty-printed request) into Alloy's "import" receiver. A file is picked up once it hasn't
  # changed for a minute (scp finished), renamed to *.imported (or *.failed), and deleted later by the
  # otel-import-cleanup timer on the node. Alloy cannot read OTLP/JSON files itself (no otlpjsonfile
  # receiver in Alloy 1.20), hence the sidecar.
  extraContainers:
    - name: otlp-json-import
      image: docker.io/library/busybox:1.37
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: otel-import, mountPath: /otel-import }
        - { name: alloy-config, mountPath: /scripts, readOnly: true }
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 64Mi }
      command: [/bin/sh, /scripts/otlp-json-import.sh]   # k8s/alloy/otlp-json-import.sh
