# Grafana Alloy as DaemonSet: the single entry point for telemetry. Multi-tenant:
#   OTLP (traces, metrics, logs) on 4317/4318 -> Tempo / Mimir / Loki, tenant = the sender's X-Scope-OrgID header
#   Pyroscope push API on 9999            -> Pyroscope, tenant = the profile's "tenant" label
#   Pod logs of every node (/var/log/pods) -> Loki, tenant "platform"
#   OTLP/JSON files in /var/lib/otel-import/<tenant>/ on every node -> the "import" pipeline below
fullnameOverride: alloy

alloy:
  enableReporting: false
  mounts:
    varlog: true
    extra:
      - { name: otel-import, mountPath: /otel-import, readOnly: true }
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
    - { name: profiles, port: 9999, targetPort: 9999, protocol: TCP }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }     # the node tailing the most pod logs reached ~350 Mi
  configMap:
    content: |
      // ---------------------------------------------------------------- OTLP
      // The sender's X-Scope-OrgID header travels with the data (include_metadata -> batch per tenant
      // -> otelcol.auth.headers) to the backends. Data without the header is rejected by them (401).
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint         = "0.0.0.0:4317"
          include_metadata = true
        }
        http {
          endpoint         = "0.0.0.0:4318"
          include_metadata = true
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      // OTLP/JSON file import: the sidecar "otlp-json-import" (below) posts the files from
      // /var/lib/otel-import/<tenant>/ to this receiver (localhost only), with X-Scope-OrgID = <tenant>.
      otelcol.receiver.otlp "import" {
        http {
          endpoint         = "127.0.0.1:4320"
          include_metadata = true
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        metadata_keys = ["X-Scope-OrgID"]
        output {
          metrics = [otelcol.exporter.otlphttp.mimir.input]
          logs    = [otelcol.exporter.otlphttp.loki.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.auth.headers "tenant" {
        header {
          key          = "X-Scope-OrgID"
          from_context = "X-Scope-OrgID"
        }
      }

      otelcol.exporter.otlphttp "mimir" {
        client {
          endpoint = "http://mimir-monolithic.lgtm.svc:8080/otlp"
          auth     = otelcol.auth.headers.tenant.handler
        }
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://loki.lgtm.svc:3100/otlp"
          auth     = otelcol.auth.headers.tenant.handler
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.lgtm.svc:4317"
          tls { insecure = true }
          auth     = otelcol.auth.headers.tenant.handler
        }
      }

      // ---------------------------------------------------------------- Profiles
      // pyroscope.receive_http does not forward request headers, so the tenant comes from the profile label
      // "tenant" (Pyroscope agent: PYROSCOPE_LABELS=tenant=<name>). One relabel+write pair per tenant;
      // profiles without a known tenant label are dropped.
      pyroscope.receive_http "default" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 9999
        }
        forward_to = [pyroscope.relabel.demo.receiver, pyroscope.relabel.platform.receiver]
      }

      pyroscope.relabel "demo" {
        forward_to = [pyroscope.write.demo.receiver]
        rule {
          source_labels = ["tenant"]
          regex         = "demo"
          action        = "keep"
        }
        rule {
          regex  = "tenant"
          action = "labeldrop"
        }
      }

      pyroscope.write "demo" {
        endpoint {
          url     = "http://pyroscope.lgtm.svc:4040"
          headers = { "X-Scope-OrgID" = "demo" }
        }
      }

      pyroscope.relabel "platform" {
        forward_to = [pyroscope.write.platform.receiver]
        rule {
          source_labels = ["tenant"]
          regex         = "platform"
          action        = "keep"
        }
        rule {
          regex  = "tenant"
          action = "labeldrop"
        }
      }

      pyroscope.write "platform" {
        endpoint {
          url     = "http://pyroscope.lgtm.svc:4040"
          headers = { "X-Scope-OrgID" = "platform" }
        }
      }

      // ---------------------------------------------------------------- Pod logs
      // Only pods on this node. The demo namespace is skipped: its logs arrive via OTLP.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "demo"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          regex         = "^;(.+)$|^([^;]+);.*$"
          replacement   = "$1$2"
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url       = "http://loki.lgtm.svc:3100/loki/api/v1/push"
          tenant_id = "platform"
        }
      }

# Plain tag instead of the chart's tag@index-digest: offline nodes only hold the amd64 image, whose
# digest differs from the multi-arch index digest, so a digest reference would never match locally.
configReloader:
  image:
    tag: v0.94.0

controller:
  volumes:
    extra:
      - name: otel-import
        hostPath: { path: /var/lib/otel-import, type: DirectoryOrCreate }
  # Imports OTLP/JSON files (one export request per line, as written by the OTel Collector's file exporter,
  # or a single pretty-printed request) into Alloy's "import" receiver. A file is picked up once it hasn't
  # changed for a minute (scp finished), renamed to *.imported (or *.failed), and deleted later by the
  # otel-import-cleanup timer on the node. Alloy cannot read OTLP/JSON files itself (no otlpjsonfile
  # receiver in Alloy 1.20), hence the sidecar.
  extraContainers:
    - name: otlp-json-import
      image: docker.io/library/busybox:1.37
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - { name: otel-import, mountPath: /otel-import }
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { memory: 64Mi }
      command: ["/bin/sh", "-c"]
      args:
        - |
          post() {  # $1 file with one OTLP/JSON request, $2 tenant
            if grep -q '"resourceSpans"' "$1"; then p=v1/traces
            elif grep -q '"resourceMetrics"' "$1"; then p=v1/metrics
            elif grep -q '"resourceLogs"' "$1"; then p=v1/logs
            else echo "not OTLP/JSON: $1"; return 1; fi
            wget -q -O /dev/null --header "Content-Type: application/json" --header "X-Scope-OrgID: $2" \
              --post-file "$1" "http://127.0.0.1:4320/$p"
          }
          while true; do
            find /otel-import -mindepth 2 -maxdepth 2 -type f -name '*.json' -mmin +0 | while read -r f; do
              tenant=$(basename "$(dirname "$f")"); ok=1
              if [ "$(grep -c . "$f")" -gt 1 ] && head -c 1 "$f" | grep -q '{' && [ "$(head -n 1 "$f" | tail -c 2)" = "}" ]; then
                # JSON Lines: one request per line
                while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  printf '%s' "$line" > /tmp/request.json
                  post /tmp/request.json "$tenant" || ok=0
                done < "$f"
              else
                post "$f" "$tenant" || ok=0
              fi
              if [ $ok = 1 ]; then mv "$f" "$f.imported"; echo "imported $f (tenant $tenant)"
              else mv "$f" "$f.failed"; echo "FAILED $f (tenant $tenant)"; fi
            done
            sleep 15
          done

