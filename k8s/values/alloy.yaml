# Grafana Alloy as DaemonSet: the single entry point for telemetry.
#   OTLP (traces, metrics, logs) on 4317/4318 -> Tempo / Mimir / Loki
#   Pyroscope push API on 9999            -> Pyroscope
#   Pod logs of every node (/var/log/pods) -> Loki
fullnameOverride: alloy

alloy:
  enableReporting: false
  mounts:
    varlog: true
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
    - { name: profiles, port: 9999, targetPort: 9999, protocol: TCP }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }     # the node tailing the most pod logs reached ~350 Mi
  configMap:
    content: |
      // ---------------------------------------------------------------- OTLP
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          metrics = [otelcol.exporter.otlphttp.mimir.input]
          logs    = [otelcol.exporter.otlphttp.loki.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlphttp "mimir" {
        client { endpoint = "http://mimir-monolithic.lgtm.svc:8080/otlp" }
      }

      otelcol.exporter.otlphttp "loki" {
        client { endpoint = "http://loki.lgtm.svc:3100/otlp" }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.lgtm.svc:4317"
          tls { insecure = true }
        }
      }

      // ---------------------------------------------------------------- Profiles
      pyroscope.receive_http "default" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 9999
        }
        forward_to = [pyroscope.write.default.receiver]
      }

      pyroscope.write "default" {
        endpoint { url = "http://pyroscope.lgtm.svc:4040" }
      }

      // ---------------------------------------------------------------- Pod logs
      // Only pods on this node. The demo namespace is skipped: its logs arrive via OTLP.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "demo"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          regex         = "^;(.+)$|^([^;]+);.*$"
          replacement   = "$1$2"
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint { url = "http://loki.lgtm.svc:3100/loki/api/v1/push" }
      }

# Plain tag instead of the chart's tag@index-digest: offline nodes only hold the amd64 image, whose
# digest differs from the multi-arch index digest, so a digest reference would never match locally.
configReloader:
  image:
    tag: v0.94.0
