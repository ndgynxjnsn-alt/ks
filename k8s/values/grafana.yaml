# Grafana: stateless (everything provisioned), one replica that reschedules quickly when its node dies.
# The image has the Drilldown apps baked in (built by ansible/download.yml), so nothing is downloaded at start.
fullnameOverride: grafana
image:
  registry: lgtm.local
  repository: grafana
  tag: 13.2.3-drilldown
  pullPolicy: Never
replicas: 1
adminUser: admin

persistence:
  enabled: false

# Grafana idles at ~300 Mi; with 512 Mi a dashboard on a 15 s refresh (flame graph, trace table, streaming)
# got it OOM-killed -> CrashLoopBackOff without any log line.
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 1Gi }

tolerations:
  - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
  - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }

grafana.ini:
  server:
    domain: grafana.org
    root_url: https://grafana.org   # absolute links; the UI also works on http://grafana.org
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  plugins:
    preinstall_disabled: true   # offline: the Drilldown apps ship in plugins-bundled
  feature_toggles:            # individual entries (feature_toggles.enable is deprecated)
    traceToProfiles: true
    tracesEmbeddedFlameGraph: true

# Dashboards from the ConfigMap "grafana-dashboards" (k8s/dashboards/*.json, created by ansible/lgtm.yml).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: lgtm
        folder: LGTM
        type: file
        disableDeletion: true
        options: { path: /var/lib/grafana/dashboards/lgtm }
dashboardsConfigMaps:
  lgtm: grafana-dashboards

# Datasources and their cross-links:
#   metric exemplar -> trace · trace -> logs / metrics / CPU profile of the span · log line -> trace
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir-monolithic.lgtm.svc:8080/prometheus
        isDefault: true
        jsonData:
          prometheusType: Mimir
          httpMethod: POST
          manageAlerts: false
          # exemplars carry the trace_id of a request that was counted -> click the diamond to open the trace
          exemplarTraceIdDestinations:
            - { name: trace_id, datasourceUid: tempo, urlDisplayLabel: View trace }

      - name: Loki
        uid: loki
        type: loki
        url: http://loki.lgtm.svc:3100
        jsonData:
          # Loki's /drilldown-limits endpoint ignores auth_enabled: false and answers 401 "no org id" without a
          # tenant header. Logs Drilldown reads volume_enabled there and shows "Log volume has not been
          # configured." on any error. "fake" is the tenant Loki uses internally in single-tenant mode.
          httpHeaderName1: X-Scope-OrgID
          # trace_id arrives as OTLP structured metadata -> link it to Tempo
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: View trace
        secureJsonData:
          httpHeaderValue1: fake

      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.lgtm.svc:3200
        jsonData:
          # dashboard trace panels and Traces Drilldown stream over gRPC-over-HTTP (tempo streamOverHttpEnabled)
          streamingEnabled: { search: true, metrics: true }
          serviceMap: { datasourceUid: mimir }
          nodeGraph: { enabled: true }
          search: { hide: false }
          # span -> its logs: {service_name="<service.name>"} | trace_id="<id>"
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            tags: [{ key: service.name, value: service_name }]
          # span -> RED metrics generated by Tempo (label "service" on traces_spanmetrics_*)
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags: [{ key: service.name, value: service }]
            queries:
              - name: Request rate
                query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[5m]))
              - name: Error rate
                query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
              - name: p95 latency
                query: histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))
          # span -> CPU flame graph of exactly that span (span_id labels from the Pyroscope OTel extension)
          tracesToProfiles:
            datasourceUid: pyroscope
            profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
            tags: [{ key: service.name, value: service_name }]

      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        url: http://pyroscope.lgtm.svc:4040
