# Grafana: 2 replicas backed by PostgreSQL (CloudNativePG cluster grafana-db), so users, orgs, sessions and
# saved dashboards are shared and survive pod/node failures; provisioned content comes from this chart.
# The image has the Drilldown apps baked in (built by ansible/download.yml), so nothing is downloaded at start.
fullnameOverride: grafana
image:
  registry: lgtm.local
  repository: grafana
  tag: 13.2.3-drilldown
  pullPolicy: Never
replicas: 2
headlessService: true    # peer discovery for unified alerting HA (ha_peers below)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: { app.kubernetes.io/name: grafana }

# database password from the Secret the CloudNativePG operator generates for the "grafana" owner
envValueFrom:
  GF_DATABASE_PASSWORD:
    secretKeyRef: { name: grafana-db-app, key: password }
  POD_IP:
    fieldRef: { fieldPath: status.podIP }
adminUser: admin

persistence:
  enabled: false

# Grafana idles at ~300 Mi; with 512 Mi a dashboard on a 15 s refresh (flame graph, trace table, streaming)
# got it OOM-killed -> CrashLoopBackOff without any log line.
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 1Gi }

tolerations:
  - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
  - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }

grafana.ini:
  database:
    type: postgres
    host: grafana-db-rw.lgtm.svc:5432    # always the current primary
    name: grafana
    user: grafana
    ssl_mode: require                    # CloudNativePG serves TLS with its own CA
  unified_alerting:
    ha_peers: grafana-headless.lgtm.svc:9094
    ha_listen_address: "$__env{POD_IP}:9094"
    ha_advertise_address: "$__env{POD_IP}:9094"
  server:
    domain: grafana.org
    root_url: https://grafana.org   # absolute links; the UI also works on http://grafana.org
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  plugins:
    preinstall_disabled: true   # offline: the Drilldown apps ship in plugins-bundled
  news:
    news_feed_enabled: false    # "Latest from the blog" on the home dashboard needs grafana.com/news.xml (offline)
  feature_toggles:            # individual entries (feature_toggles.enable is deprecated)
    traceToProfiles: true
    tracesEmbeddedFlameGraph: true

# Dashboards from the ConfigMap "grafana-dashboards" (k8s/dashboards/*.json, created by ansible/lgtm.yml).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: lgtm
        folder: LGTM
        type: file
        disableDeletion: true
        options: { path: /var/lib/grafana/dashboards/lgtm }
dashboardsConfigMaps:
  lgtm: grafana-dashboards

# Datasources are rendered by ansible/lgtm.yml from ansible/templates/grafana-datasources.yaml.j2:
# the Main org gets them via provisioning (all tenants), every tenant org via the Grafana API.
