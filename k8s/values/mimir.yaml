# Mimir monolithic (-target=all) via the NGDATA fork of mimir-distributed (scripts/deploy.sh fetches it).
# 3 replicas, replication factor 3: survives the loss of one node.
deploymentMode: monolithic
fullnameOverride: mimir

image:
  tag: 3.2.3

monolithic:
  replicas: 3
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1536Mi }
  terminationGracePeriodSeconds: 60
  # S3 credentials from the Secret s3-credentials (the chart runs Mimir with -config.expand-env=true)
  extraEnvFrom: [{ secretRef: { name: s3-credentials } }]
  extraArgs:
    # On a fresh install the gossip service has no endpoints yet; don't crash, keep retrying the join.
    memberlist.abort-if-fast-join-fails: "false"
  topologySpreadConstraints:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# Classic architecture (no Kafka), no bundled MinIO, no nginx gateway: clients talk to mimir-monolithic directly.
kafka: { enabled: false }
minio: { enabled: false }
rollout_operator: { enabled: false }
gateway: { enabled: false }
alertmanager: { enabled: false }
overrides_exporter: { enabled: false }

mimir:
  structuredConfig:
    multitenancy_enabled: true    # X-Scope-OrgID on every request (tenants in group_vars)
    tenant_federation:
      enabled: true               # "demo|platform" for Grafana's Main org
    ingest_storage:
      enabled: false
      kafka: { address: null, topic: null, auto_create_topic_default_partitions: null }
    distributor:
      remote_timeout: null
    # Schedulers are found through the memberlist ring instead of headless-service DNS, so a scheduler on a
    # dead node drops out after its heartbeat times out (DNS keeps listing not-ready pods -> slow queries).
    query_scheduler:
      service_discovery_mode: ring
    # Each querier spreads max_concurrent over all query-scheduler instances (one per replica = 3). The chart's
    # 16 isn't divisible by 3 ("max concurrency is not evenly divisible across request queue instances"), so use a
    # multiple of 3: 12 = 4 parallel sub-queries per querier and scheduler.
    querier:
      max_concurrent: 12
    frontend:
      scheduler_address: ""
    frontend_worker:
      scheduler_address: ""
    ingester:
      push_grpc_method_enabled: null
      ring:
        replication_factor: 3
        tokens_file_path: /data/ingester-tokens # chart default /data/ingester/ does not exist in monolithic mode
        # Mark a dead instance unhealthy within a minute (chart default 10m), so queries skip it.
        heartbeat_period: 15s
        heartbeat_timeout: 1m
    store_gateway:
      sharding_ring:
        heartbeat_period: 15s
        heartbeat_timeout: 1m
    common:
      storage:
        backend: s3
        s3:
          endpoint: garage.lgtm.svc:3900
          region: garage
          insecure: true
          access_key_id: ${S3_ACCESS_KEY_ID}
          secret_access_key: ${S3_SECRET_ACCESS_KEY}
    blocks_storage:
      s3: { bucket_name: mimir-blocks }
    ruler_storage:
      s3: { bucket_name: mimir-ruler }
    alertmanager_storage:
      s3: { bucket_name: mimir-alertmanager }
    limits:
      compactor_blocks_retention_period: 7d
      max_global_exemplars_per_user: 100000
      native_histograms_ingestion_enabled: true
      otel_metric_suffixes_enabled: true
      max_label_names_per_series: 50
      # resource attributes -> metric labels (service_name, deployment_environment_name, ...), the same
      # names Loki and Pyroscope use, so dashboards and links can filter all signals the same way
      promote_otel_resource_attributes: "service.name,service.namespace,service.instance.id,\
        deployment.environment.name,k8s.pod.name,k8s.namespace.name"
