# Services outside the cluster, on the Ansible host. Configs with secrets are rendered into .generated/ by
#   ansible-playbook ansible/external.yml -K      (which also runs: sudo docker compose up -d)
#
#   keycloak  http://keycloak.org:8080   OAuth/OIDC for Grafana (realm "lgtm", client "grafana")
#   pebble    https://192.168.56.1:14000/dir   ACME server with External Account Binding, stands in for the
#             company CA; it validates HTTP-01 challenges on the cluster hostnames (extra_hosts below).
name: lgtm-external

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]   # imports .generated/keycloak/*.json if the realm doesn't exist
    env_file: ./.generated/keycloak.env        # KC_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD
    environment:
      KC_HOSTNAME: http://keycloak.org:8080    # one issuer URL for browsers and for Grafana
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./.generated/keycloak:/opt/keycloak/data/import:ro"]
    restart: unless-stopped

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/config/pebble-config.json"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"                   # validate challenges immediately
      PEBBLE_WFE_NONCEREJECT: "0"              # don't reject nonces at random (Pebble's default chaos)
    ports:
      - "14000:14000"                          # ACME API (TLS cert from .generated/pebble/acme.crt)
      - "15000:15000"                          # management: /roots/0 = root of the issued certificates
    volumes: ["./.generated/pebble:/config:ro"]
    # HTTP-01 validation connects to http://<hostname>/.well-known/acme-challenge/ - the cluster VIPs
    # (keep in sync with service_vips in ansible/group_vars/all.yml)
    extra_hosts:
      - "grafana.org:192.168.56.21"
      - "loki.org:192.168.56.22"
      - "tempo.org:192.168.56.23"
      - "mimir.org:192.168.56.24"
      - "pyroscope.org:192.168.56.25"
      - "alloy.org:192.168.56.26"
      - "garage.org:192.168.56.27"
    restart: unless-stopped
