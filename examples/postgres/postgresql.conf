# Only non-default settings; everything else uses PostgreSQL's built-in defaults.
listen_addresses = '*'

# TimescaleDB must be preloaded; pg_stat_statements: per-query statistics for Alloy's postgres exporter
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.telemetry_level = off      # offline
pg_stat_statements.track = all
compute_query_id = on

# Slow query log: every statement that runs for >= 1 s, with its text. The catalog backend's statements carry
# the trace context as SQL comment (/*traceparent='...'*/), its session the business id in application_name.
log_min_duration_statement = 1000

# Structured JSON logs into a volume shared with the Alloy sidecar (the image creates the directory owned by
# postgres, mode 0755; log_file_mode makes the files readable for the sidecar)
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'   # jsonlog writes *.json
log_file_mode = 0644
log_rotation_age = 1d
