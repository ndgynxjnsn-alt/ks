# Copies a saved image to the node and loads it, unless the node already has an image with this id.
#   Var: image (a result of "docker image inspect": item.key/value = name/reference, stdout = id)
- name: "Image id on the node: {{ image.item.value }}"
  ansible.builtin.command: docker image inspect --format {{ '{{.Id}}' }} {{ image.item.value }}
  register: node_image
  changed_when: false
  failed_when: false

- name: "Copy and load {{ image.item.value }}"
  when: node_image.stdout != image.stdout
  block:
    - name: Copy the image archive
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.images/{{ image.item.key }}-{{ image.stdout[7:19] }}.tar"
        dest: /tmp/{{ image.item.key }}.tar
        mode: "0644"

    - name: Load the image
      ansible.builtin.command: docker load -i /tmp/{{ image.item.key }}.tar
      changed_when: true

    - name: Remove the archive
      ansible.builtin.file: { path: "/tmp/{{ image.item.key }}.tar", state: absent }
