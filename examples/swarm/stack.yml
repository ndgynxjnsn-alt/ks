# The example shop on Docker Swarm, WITHOUT the OTel Java agent and the Pyroscope agent (same images as
# examples/docker-compose.yml). Telemetry comes from outside the apps instead:
#   Beyla (eBPF, one per node, swarm.yml)      -> RED metrics + spans of every HTTP/SQL call
#   alloy-node (one per node, swarm.yml)       -> container logs + eBPF CPU profiles
#   prometheus (this stack, one replica)       -> scrapes every service labelled prometheus.io/scrape
# Deployed by swarm.yml:  docker stack deploy -c stack.yml shop
x-backend: &backend
  image: lgtm-examples/backend:1.0
  networks: [shop]
  deploy: &backend-deploy
    labels: &scrape
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /actuator/prometheus
    resources: { limits: { memory: 320M } }

services:
  shop:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: shop
      OTEL_SERVICE_NAME: shop                     # Beyla names the service after it
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=swarm,deployment.environment.name=swarm
  stock:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: stock
      OTEL_SERVICE_NAME: stock
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=swarm,deployment.environment.name=swarm
  pricing:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: pricing
      OTEL_SERVICE_NAME: pricing
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=swarm,deployment.environment.name=swarm
  catalog:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: catalog
      OTEL_SERVICE_NAME: catalog
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=swarm,deployment.environment.name=swarm
  notification:
    <<: *backend
    environment:
      SPRING_PROFILES_ACTIVE: notification
      OTEL_SERVICE_NAME: notification
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=swarm,deployment.environment.name=swarm

  frontend:
    image: lgtm-examples/frontend:1.0
    networks: [shop]
    ports: ["8088:8080"]                          # http://<any swarm node>:8088

  # Slow queries (>= 1 s) go to stderr -> Docker log -> alloy-node -> Loki
  postgres:
    image: postgres:18.6
    networks: [shop]
    environment: { POSTGRES_PASSWORD: postgres }
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on",
              "-c", "log_min_duration_statement=1000"]
    configs:
      - { source: pg_init, target: /docker-entrypoint-initdb.d/01-init.sql }
    volumes: [pgdata:/var/lib/postgresql]
    deploy:
      placement: { constraints: [node.role == manager] }   # the data volume stays on one node

  loadgen:
    image: curlimages/curl:8.17.0
    networks: [shop]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" -X POST http://frontend:8080/api/orders \
            -H 'Content-Type: application/json' -d "{\"itemId\": $$(( $$(date +%s) % 50 + 1 ))}"
          sleep 4
        done

  # The single Prometheus scraper of the Swarm: Docker Swarm service discovery (needs the manager's Docker API)
  prometheus:
    image: ${ALLOY_IMAGE}
    networks: [shop]
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    environment:
      LGTM_OTLP_URL: http://alloy.${LGTM_DOMAIN}
      LGTM_TENANT: ${LGTM_TENANT}
    extra_hosts: ["alloy.${LGTM_DOMAIN}:${LGTM_INGRESS_IP}"]
    configs:
      - { source: prometheus, target: /etc/alloy/config.alloy }
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    deploy:
      placement: { constraints: [node.role == manager] }

networks:
  shop:
    driver: overlay
    attachable: true

volumes:
  pgdata:

# Swarm configs are immutable: swarm.yml puts a hash of the content into the name, so a change creates a new one
configs:
  pg_init:
    name: pg_init_${PG_INIT_HASH}
    file: ./init.sql
  prometheus:
    name: prometheus_${PROMETHEUS_HASH}
    file: ./prometheus.alloy
