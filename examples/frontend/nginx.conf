# Serves the built app and proxies /api to the shop backend: same origin, so the browser sends the trace
# context (traceparent) and the business id (X-Order-Id) without CORS.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's DNS, re-resolved: the shop container's address changes when it is recreated
  resolver 127.0.0.11 valid=10s;
  set $shop http://shop:8080;

  location /api/ {
    proxy_pass $shop;
  }

  location / {
    try_files $uri /index.html;
  }
}
