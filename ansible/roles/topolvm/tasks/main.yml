# The LVM volume group TopoLVM provisions PersistentVolumes from: one whole disk per node (topolvm_disk, e.g.
# /dev/disk/by-id/...). Created once and kept on re-runs; Garage leaves this disk alone (topolvm_disk_name).
- name: Resolve the TopoLVM disk (a /dev/disk/by-id link or the device itself)
  ansible.builtin.stat: { path: "{{ topolvm_disk }}", follow: false }
  register: topolvm_disk_stat

- name: Kernel name of the TopoLVM disk (excluded from Garage)
  ansible.builtin.set_fact:
    topolvm_disk_name: "{{ (topolvm_disk_stat.stat.lnk_source | default(topolvm_disk)) | basename }}"
  when: topolvm_disk_stat.stat.exists

- name: Expect the TopoLVM disk
  ansible.builtin.assert:
    that: topolvm_disk_name is defined and topolvm_disk_name in ansible_facts.devices
    fail_msg: "topolvm_disk {{ topolvm_disk }} is not a disk on this node"
    quiet: true

- name: Volume group
  community.general.lvg: { vg: "{{ topolvm_vg }}", pvs: ["/dev/{{ topolvm_disk_name }}"] }
