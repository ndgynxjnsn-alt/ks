topolvm_vg: topolvm   # volume group for TopoLVM (k8s/values/topolvm.yaml: lvmd.deviceClasses)
# force_disk_format (ansible/group_vars/all.yml): a disk with a filesystem, partitions or another volume group
# is only wiped for TopoLVM with -e force_disk_format=true. The TopoLVM volume group itself is never wiped.
