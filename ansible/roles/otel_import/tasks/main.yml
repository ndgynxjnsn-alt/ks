# Drop directory for OTLP/JSON files: scp a file to <node>:/var/lib/otel-import/<tenant>/ and Alloy's
# otlp-json-import sidecar imports it as that tenant (k8s/values/alloy.yaml). Processed files are renamed
# to *.imported / *.failed and deleted by a timer after otel_import_keep_minutes.
- name: Group for uploading files
  ansible.builtin.group: { name: "{{ otel_import_group }}", system: true }

- name: Add the Ansible user to the upload group
  ansible.builtin.user: { name: "{{ ansible_user }}", groups: ["{{ otel_import_group }}"], append: true }

- name: Import directory
  ansible.builtin.file:
    path: "{{ otel_import_dir }}"
    state: directory
    owner: root
    group: "{{ otel_import_group }}"
    mode: "0755"

- name: One directory per tenant (setgid, group-writable)
  ansible.builtin.file:
    path: "{{ otel_import_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: "{{ otel_import_group }}"
    mode: "2775"
  loop: "{{ tenants }}"
  loop_control: { label: "{{ item.name }}" }

- name: Cleanup service
  ansible.builtin.template:
    dest: /etc/systemd/system/otel-import-cleanup.service
    mode: "0644"
    src: otel-import-cleanup.service.j2

- name: Cleanup timer (every 15 minutes)
  ansible.builtin.template:
    dest: /etc/systemd/system/otel-import-cleanup.timer
    mode: "0644"
    src: otel-import-cleanup.timer.j2

- name: Enable cleanup timer
  ansible.builtin.systemd_service:
    name: otel-import-cleanup.timer
    enabled: true
    state: started
    daemon_reload: true
