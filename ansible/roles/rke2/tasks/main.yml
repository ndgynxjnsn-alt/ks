# RKE2 server in air-gap mode: tarball install + every container image preloaded from artifacts/.
- name: Kernel settings (inotify for Alloy/Loki)
  ansible.posix.sysctl: { name: "{{ item.key }}", value: "{{ item.value }}", sysctl_file: /etc/sysctl.d/90-lgtm.conf }
  loop: "{{ {'fs.inotify.max_user_instances': 1024, 'fs.inotify.max_user_watches': 1048576} | dict2items }}"

- name: Default route (only when the inventory sets default_gateway)
  ansible.builtin.template: { src: 60-default-route.yaml.j2, dest: /etc/netplan/60-default-route.yaml, mode: "0600" }
  when: default_gateway is defined
  notify: Apply netplan

- name: Apply a changed default route now
  ansible.builtin.meta: flush_handlers

- name: Create directories
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  tags: [images]
  loop: [/root/rke2-artifacts, /etc/rancher/rke2, "{{ rke2_images_dir }}", /var/lib/rancher/rke2/server/manifests]

- name: Copy RKE2 tarball and install script
  ansible.builtin.copy: { src: "{{ artifacts_dir }}/rke2/{{ item }}", dest: /root/rke2-artifacts/, mode: "0644" }
  loop: [install.sh, rke2.linux-amd64.tar.gz, sha256sum-amd64.txt]

# RKE2 imports every archive in agent/images at start. Archives are only copied (and imported into a running
# containerd) when their image is not on the node yet, so re-runs don't move gigabytes around.
# Ship new images to a running cluster without touching anything else:  site.yml --tags images
- name: RKE2 air-gap bundles
  ansible.builtin.copy: { src: "{{ item }}", dest: "{{ rke2_images_dir }}/", mode: "0644" }
  loop: "{{ query('fileglob', artifacts_dir + '/rke2/rke2-images-*.tar.zst') }}"
  loop_control: { label: "{{ item | basename }}" }
  tags: [images]

- name: Images already in containerd
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock images -o json
  register: rke2_crictl_images
  changed_when: false
  failed_when: false   # fresh node: RKE2 (and containerd) not installed or not running yet
  tags: [images]

- name: Copy missing image archives
  ansible.builtin.copy:
    src: "{{ artifacts_dir }}/images/{{ item.file }}"
    dest: "{{ rke2_images_dir }}/"
    mode: "0644"
  loop: "{{ rke2_image_index | rejectattr('ref', 'in', present_images) }}"
  loop_control: { label: "{{ item.ref }}" }
  vars:
    rke2_image_index: "{{ lookup('file', artifacts_dir + '/images/index.yml') | from_yaml }}"
    present_images: >-
      {{ ((rke2_crictl_images.stdout | from_json).images | map(attribute='repoTags') | flatten)
         if rke2_crictl_images.rc == 0 else [] }}
  register: rke2_preloaded
  tags: [images]

- name: Import copied images into the running containerd
  ansible.builtin.shell: >-
    set -o pipefail;
    zstd -dc {{ rke2_images_dir }}/{{ item.item.file }} |
    /var/lib/rancher/rke2/bin/ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
  args: { executable: /bin/bash }
  changed_when: true
  loop: "{{ rke2_preloaded.results | selectattr('changed') | list }}"
  loop_control: { label: "{{ item.item.ref }}" }
  when: rke2_crictl_images.rc == 0
  tags: [images]

- name: Install RKE2 from the tarball
  ansible.builtin.command: sh /root/rke2-artifacts/install.sh
  environment:
    INSTALL_RKE2_ARTIFACT_PATH: /root/rke2-artifacts
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  args: { creates: /usr/local/bin/rke2 }
  register: rke2_install

- name: Configure RKE2
  ansible.builtin.template: { src: config.yaml.j2, dest: /etc/rancher/rke2/config.yaml, mode: "0600" }
  notify: Restart RKE2   # site.yml runs the servers one after another, so restarts are rolling

- name: Add-on manifests applied by RKE2 itself
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/var/lib/rancher/rke2/server/manifests/{{ item }}"
    mode: "0644"
  loop: [kube-vip.yaml, rke2-canal-config.yaml, rke2-traefik-config.yaml]
  tags: [addons]

- name: Local-path storage manifest
  ansible.builtin.copy: { src: local-path-storage.yaml, dest: /var/lib/rancher/rke2/server/manifests/, mode: "0644" }

- name: Start RKE2 server
  ansible.builtin.systemd_service: { name: rke2-server, enabled: true, state: started }

- name: Wait until the cluster answers on the VIP (kube-vip)
  ansible.builtin.uri: { url: "https://{{ vip }}:9345/ping", validate_certs: false, return_content: true }
  register: rke2_ping
  until: rke2_ping.status == 200
  retries: 60
  delay: 5

- name: Shell environment for kubectl/crictl on the node
  ansible.builtin.template: { src: rke2-profile.sh.j2, dest: /etc/profile.d/rke2.sh, mode: "0644" }
