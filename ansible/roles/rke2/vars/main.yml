rke2_first_server: "{{ inventory_hostname == groups['nodes'][0] }}"
# The interface that carries the node IP (kube-vip announces the VIP on it, flannel uses it for VXLAN).
rke2_iface: >-
  {{ ansible_interfaces | map('regex_replace', '[-.:]', '_') | map('extract', ansible_facts)
     | selectattr('ipv4', 'defined') | selectattr('ipv4.address', 'equalto', ansible_host)
     | map(attribute='device') | first }}
