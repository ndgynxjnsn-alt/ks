# Data disks are found dynamically: every whole disk without partitions or holders (the root disk has
# partitions), sorted by name and numbered 1..N -> label garageN -> /srv/garage/dataN.
#
# Each run REBUILDS Garage from scratch: stop, unmount, wipe metadata, force-format all data disks.
# All S3 data is erased (accepted for this lab); the cluster tasks below then re-form the cluster.
- name: Find data disks
  ansible.builtin.set_fact:
    garage_disks: >-
      {{ ansible_facts.devices | dict2items
         | rejectattr('key', 'match', garage_disk_exclude)
         | selectattr('value.partitions', 'equalto', {})
         | selectattr('value.holders', 'equalto', [])
         | map(attribute='key') | sort }}

- name: Expect at least one data disk
  ansible.builtin.assert:
    that: garage_disks | length > 0
    fail_msg: No unpartitioned data disks found
    success_msg: "Data disks: {{ garage_disks | join(', ') }}"

- name: Stop garage
  ansible.builtin.systemd_service: { name: garage, state: stopped }
  failed_when: false

- name: Unmount all Garage data directories
  ansible.builtin.shell: |
    for m in $(findmnt -rn -o TARGET | grep '^/srv/garage/data'); do umount "$m"; done
    sed -i '/^LABEL=garage[0-9]* /d' /etc/fstab
  changed_when: true

- name: Wipe Garage metadata (node identity, layout, buckets)
  ansible.builtin.file: { path: /var/lib/garage, state: absent }

- name: Format data disks
  community.general.filesystem:
    dev: "/dev/{{ item }}"
    fstype: ext4
    force: true
    opts: "-L garage{{ idx + 1 }} -m 0"
  loop: "{{ garage_disks }}"
  loop_control: { index_var: idx }

- name: Mount data disks
  ansible.posix.mount:
    path: "/srv/garage/data{{ idx + 1 }}"
    src: "LABEL=garage{{ idx + 1 }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted
  loop: "{{ garage_disks }}"
  loop_control: { index_var: idx }

- name: Install garage binary
  ansible.builtin.copy:
    src: "{{ artifacts_dir }}/bin/garage"
    dest: /usr/local/bin/garage
    mode: "0755"


- name: Create metadata directory
  ansible.builtin.file: { path: /var/lib/garage/meta, state: directory, mode: "0700" }

- name: Configure garage
  ansible.builtin.template: { src: garage.toml.j2, dest: /etc/garage.toml, mode: "0600" }


- name: Install systemd unit
  ansible.builtin.template: { src: garage.service.j2, dest: /etc/systemd/system/garage.service, mode: "0644" }


- name: Start garage
  ansible.builtin.systemd_service: { name: garage, enabled: true, state: restarted, daemon_reload: true }

- name: Read this node's Garage id
  ansible.builtin.command: garage -c /etc/garage.toml node id -q
  register: garage_node_id
  changed_when: false
  retries: 10
  delay: 3
  until: garage_node_id.rc == 0

- name: Form the cluster (layout, key, buckets)
  ansible.builtin.include_tasks: cluster.yml
  args: { apply: { run_once: true } }
  run_once: true
