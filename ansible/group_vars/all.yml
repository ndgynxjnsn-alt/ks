# ---------------------------------------------------------------- versions (latest as of 2026-10-22)
rke2_version: v1.37.1+rke2r1
kube_vip_version: v1.3.1
local_path_provisioner_version: v0.0.37
garage_version: v2.4.1
helm_version: v4.3.1
kubectl_version: v1.37.1
k9s_version: v0.51.0

# Chart versions, images and constants shared with Argo CD: settings.yaml in the repository root
lgtm_settings: "{{ lookup('file', repo_dir ~ '/settings.yaml') | from_yaml }}"
charts: "{{ lgtm_settings.charts }}"
mimir_chart: "{{ lgtm_settings.mimir_chart }}"
grafana_base_image: "{{ lgtm_settings.grafana_base_image }}"
grafana_image: "{{ lgtm_settings.grafana_image }}"
grafana_plugins: "{{ lgtm_settings.grafana_plugins }}"
grafana_db_image: "{{ lgtm_settings.grafana_db_image }}"
pgbackweb_image: "{{ lgtm_settings.pgbackweb_image }}"
s3_endpoint: "{{ lgtm_settings.s3_endpoint }}"
traefik_selector: "{{ lgtm_settings.traefik_selector }}"

demo_image: lgtm.local/demo:1.0.0
otel_agent_version: 2.32.0
pyroscope_agent_version: 2.9.2   # Pyroscope Java agent (async-profiler)
pyroscope_otel_version: 2.1.4    # OTel extension: stamps profiles with span ids/names (trace <-> profile)

# ---------------------------------------------------------------- disks
# site.yml never formats a disk that holds data, so it can run again (e.g. an RKE2 upgrade) without losing
# anything. true (per run: site.yml -e force_disk_format=true) ERASES:
#   - a TopoLVM disk that holds something else (filesystem, partitions, another volume group)
#   - all Garage data disks and Garage's metadata: Garage is rebuilt empty (all S3 data is lost)
force_disk_format: false

# ---------------------------------------------------------------- paths on the Ansible host
repo_dir: "{{ playbook_dir | dirname }}"
artifacts_dir: "{{ repo_dir }}/artifacts"
secrets_dir: "{{ repo_dir }}/.secrets"
bin_dir: "{{ repo_dir }}/.bin"

# ---------------------------------------------------------------- secrets (generated once into .secrets/)
rke2_token: "{{ lookup('password', secrets_dir + '/rke2_token chars=digits,abcdef length=64') }}"
garage_rpc_secret: "{{ lookup('password', secrets_dir + '/garage_rpc_secret chars=digits,abcdef length=64') }}"
garage_admin_token: "{{ lookup('password', secrets_dir + '/garage_admin_token chars=digits,abcdef length=64') }}"
s3_access_key_id: "GK{{ lookup('password', secrets_dir + '/s3_access_key_id chars=digits,abcdef length=24') }}"
s3_secret_access_key: "{{ lookup('password', secrets_dir + '/s3_secret_access_key chars=digits,abcdef length=64') }}"
grafana_admin_password: >-
  {{ lookup('password', secrets_dir + '/grafana_admin_password chars=ascii_letters,digits length=20') }}
pgbackweb_admin_password: >-
  {{ lookup('password', secrets_dir + '/pgbackweb_admin_password chars=ascii_letters,digits length=20') }}
pgbackweb_encryption_key: >-
  {{ lookup('password', secrets_dir + '/pgbackweb_encryption_key chars=ascii_letters,digits length=40') }}
pgbackweb_db_password: >-
  {{ lookup('password', secrets_dir + '/pgbackweb_db_password chars=ascii_letters,digits length=32') }}

garage_buckets: [loki-chunks, loki-ruler, tempo-traces, mimir-blocks, mimir-ruler, mimir-alertmanager, pyroscope-data,
                 grafana-db-backups, pgbackweb]   # Grafana's PostgreSQL: CloudNativePG (Barman) and PG Back Web
