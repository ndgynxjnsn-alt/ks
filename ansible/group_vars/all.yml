# ---------------------------------------------------------------- versions (latest as of 2026-10-22)
rke2_version: v1.37.1+rke2r1
kube_vip_version: v1.3.1
local_path_provisioner_version: v0.0.37
garage_version: v2.4.1
helm_version: v4.3.1
kubectl_version: v1.37.1
k9s_version: v0.51.0

# Helm charts, pulled by download.yml into artifacts/charts. "oci" is the OCI reference (preferred, listed in
# artifacts/helm-charts-oci.txt); "repo" is a classic HTTPS repository for charts without OCI publication.
charts:
  loki: { oci: oci://ghcr.io/grafana-community/helm-charts/loki, version: 19.0.3 }        # Loki 3.7.9
  tempo: { oci: oci://ghcr.io/grafana-community/helm-charts/tempo, version: 3.2.1 }       # Tempo 3.1.1
  grafana: { oci: oci://ghcr.io/grafana-community/helm-charts/grafana, version: 14.0.1 }  # Grafana 13.2.4
  pyroscope: { oci: oci://ghcr.io/grafana/helm-charts/pyroscope, version: 2.4.1 }         # Pyroscope 2.4.1
  # Alloy's chart is only released to the HTTPS repository (no OCI artifact as of 1.14.2)
  alloy: { repo: https://grafana.github.io/helm-charts, version: 1.14.2 }                 # Alloy 1.21.1
  cert-manager: { oci: oci://quay.io/jetstack/charts/cert-manager, version: v1.21.2 }
  trust-manager: { oci: oci://quay.io/jetstack/charts/trust-manager, version: v0.26.0 }
  cloudnative-pg: { oci: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg, version: 0.29.1 }  # operator 1.30.1
  argo-cd: { oci: oci://ghcr.io/argoproj/argo-helm/argo-cd, version: 10.10.5 }           # Argo CD 3.5.5
  kube-state-metrics:                                                                     # 2.20.0
    oci: oci://ghcr.io/prometheus-community/charts/kube-state-metrics
    version: 8.6.0
# Mimir monolithic chart from the NGDATA fork (branch release-6.0.6-1-lily), pinned; packaged by download.yml.
mimir_chart:
  repo: https://github.com/NGDATA/mimir.git
  commit: d089f535d717c7f8a7e06dc70f84bb27017b4373
  version: 6.0.6

# Grafana image with the Drilldown apps baked in (no plugin downloads at runtime).
grafana_base_image: grafana/grafana:13.2.4
grafana_image: lgtm.local/grafana:13.2.4-drilldown
grafana_plugins:
  - { id: grafana-metricsdrilldown-app, version: 3.0.0 }
  - { id: grafana-lokiexplore-app, version: 3.0.0 }
  - { id: grafana-exploretraces-app, version: 3.0.0 }
  - { id: grafana-pyroscope-app, version: 3.0.0 }

# PostgreSQL for Grafana (CloudNativePG cluster "grafana-db", 3 instances)
grafana_db_image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

demo_image: lgtm.local/demo:1.0.0
otel_agent_version: 2.32.0
pyroscope_agent_version: 2.9.2   # Pyroscope Java agent (async-profiler)
pyroscope_otel_version: 2.1.4    # OTel extension: stamps profiles with span ids/names (trace <-> profile)

# In-cluster S3 endpoint: Service "garage" whose endpoints are the Garage daemons on the nodes.
s3_endpoint: garage.lgtm.svc:3900

# ---------------------------------------------------------------- paths on the Ansible host
repo_dir: "{{ playbook_dir | dirname }}"
artifacts_dir: "{{ repo_dir }}/artifacts"
secrets_dir: "{{ repo_dir }}/.secrets"
bin_dir: "{{ repo_dir }}/.bin"

# ---------------------------------------------------------------- secrets (generated once into .secrets/)
rke2_token: "{{ lookup('password', secrets_dir + '/rke2_token chars=digits,abcdef length=64') }}"
garage_rpc_secret: "{{ lookup('password', secrets_dir + '/garage_rpc_secret chars=digits,abcdef length=64') }}"
garage_admin_token: "{{ lookup('password', secrets_dir + '/garage_admin_token chars=digits,abcdef length=64') }}"
s3_access_key_id: "GK{{ lookup('password', secrets_dir + '/s3_access_key_id chars=digits,abcdef length=24') }}"
s3_secret_access_key: "{{ lookup('password', secrets_dir + '/s3_secret_access_key chars=digits,abcdef length=64') }}"
grafana_admin_password: >-
  {{ lookup('password', secrets_dir + '/grafana_admin_password chars=ascii_letters,digits length=20') }}

garage_buckets: [loki-chunks, loki-ruler, tempo-traces, mimir-blocks, mimir-ruler, mimir-alertmanager, pyroscope-data]

# Pods behind the ingress VIP: RKE2's bundled Traefik.
traefik_selector: { app.kubernetes.io/name: rke2-traefik }
