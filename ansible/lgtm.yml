# Deploys the LGTM stack the GitOps way: Ansible creates the Secrets, publishes repository and charts,
# installs Argo CD and the root Application; Argo CD deploys everything else from Git (argocd/root).
#   ansible-playbook -i <inventory> ansible/lgtm.yml
- name: Deploy the LGTM stack with Argo CD
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "{{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig"
    tenant_names: "{{ tenants | map(attribute='name') | list }}"

    # ------------------------------------------------------------ values of the root app (argocd/root)
    # apps: one Argo CD Application each; waves: CRD providers -> platform resources -> backends -> rest
    root_values:
      repo:
        git: "{{ gitops.repo_url }}"
        revision: "{{ gitops.revision }}"
        helm: "{{ gitops.helm_repo_url }}"
      apps:
        cert-manager:
          version: "{{ charts['cert-manager'].version }}"
          namespace: cert-manager
          wave: -3
          values: "{{ cert_manager_overlay }}"
        cloudnative-pg:
          version: "{{ charts['cloudnative-pg'].version }}"
          namespace: cnpg-system
          wave: -3
        kube-state-metrics:
          version: "{{ charts['kube-state-metrics'].version }}"
          namespace: kube-system
          wave: 0
        platform:
          path: argocd/platform
          wave: -2
          values: "{{ platform_values }}"
        loki: { version: "{{ charts.loki.version }}", wave: 0 }
        mimir: { chart: mimir-distributed, version: "{{ mimir_chart.version }}", wave: 0 }
        tempo: { version: "{{ charts.tempo.version }}", wave: 0 }
        pyroscope: { version: "{{ charts.pyroscope.version }}", wave: 0 }
        alloy: { version: "{{ charts.alloy.version }}", wave: 1 }
        grafana:
          version: "{{ charts.grafana.version }}"
          wave: 1
          values: "{{ grafana_overlay | combine(grafana_oauth_overlay if oauth.enabled else {}, recursive=true) }}"
        demo: { path: k8s/demo, namespace: demo, wave: 2 }

    # cluster-level resources (argocd/platform): ingress VIP, ingresses, TLS, Grafana database
    platform_values:
      domain: "{{ domain }}"
      ingressVIP: "{{ ingress_vip }}"
      hosts: "{{ lgtm_hosts }}"
      nodes: "{{ groups['nodes'] | map('extract', hostvars, 'ansible_host') | list }}"
      traefikSelector: "{{ traefik_selector }}"
      tls:
        issuer: "{{ tls_issuer.name }}"
        acmeServer: "{{ tls_issuer.acme_server }}"
        email: "{{ tls_issuer.email }}"
        eabKeyID: "{{ tls_issuer.eab_kid }}"
        caBundle: >-
          {{ lookup('file', tls_issuer.ca_bundle_file) | b64encode
             if tls_issuer.ca_bundle_file and tls_issuer.ca_bundle_file is file else '' }}
        dns01:
          nameserver: "{{ tls_issuer.dns01.nameserver }}"
          tsigKeyName: "{{ tls_issuer.dns01.tsig_key_name }}"
          tsigAlgorithm: "{{ tls_issuer.dns01.tsig_algorithm }}"
      grafanaDB: { image: "{{ grafana_db_image }}", instances: 3, size: 1Gi }

    # DNS-01 propagation check against the zone's own server (zones invisible to public resolvers)
    cert_manager_overlay: >-
      {{ {'extraArgs': ['--dns01-recursive-nameservers-only',
                        '--dns01-recursive-nameservers=' ~ tls_issuer.dns01.recursive_nameservers]}
         if tls_issuer.dns01.recursive_nameservers is defined else {} }}

    grafana_overlay:
      grafana.ini:
        server:
          domain: "grafana.{{ domain }}"
          root_url: "https://grafana.{{ domain }}"   # absolute links; the UI also works on http
      # Main org: all tenants (cross-tenant queries); tenant orgs are set up via the API below
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources: >-
            {{ lookup('template', 'templates/grafana-datasources.yaml.j2',
                      template_vars={'ds_tenants': tenant_names, 'ds_dollar': '$$'}) | from_yaml }}

    # Login via the IdP. Group -> Grafana org/role:
    #   grafana-admins -> Admin in every org + Grafana server admin;  tenant-<name> -> Editor in org <name>
    # auto_assign_org is off, so tenant users don't land in the Main org (which sees all tenants).
    grafana_oauth_overlay:
      hostAliases: "{{ [{'ip': oauth.host_ip, 'hostnames': [oauth.hostname]}] if oauth.host_ip is defined else [] }}"
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef: { name: grafana-oauth, key: client-secret }
      grafana.ini:
        users:
          auto_assign_org: false
        auth.generic_oauth:
          enabled: true
          name: Keycloak
          allow_sign_up: true
          client_id: "{{ oauth.client_id }}"
          scopes: openid email profile
          use_pkce: true
          auth_url: "{{ oauth.issuer }}/protocol/openid-connect/auth"
          token_url: "{{ oauth.issuer }}/protocol/openid-connect/token"
          api_url: "{{ oauth.issuer }}/protocol/openid-connect/userinfo"
          signout_redirect_url: >-
            {{ oauth.issuer }}/protocol/openid-connect/logout?client_id={{ oauth.client_id
            }}&post_logout_redirect_uri={{ ('https://grafana.' ~ domain ~ '/login') | urlencode | replace('/', '%2F') }}
          login_attribute_path: preferred_username
          email_attribute_path: email
          name_attribute_path: name
          groups_attribute_path: groups
          role_attribute_path: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
          allow_assign_grafana_admin: true
          org_attribute_path: groups
          org_mapping: >-
            {{ (['grafana-admins:*:Admin'] + (tenant_names | map('regex_replace', '^(.*)$', 'tenant-\1:\1:Editor')
                | list)) | join(' ') }}

  tasks:
    - name: Secrets (namespaces, S3, Grafana admin + OAuth, EAB, TSIG, repository credentials)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: secrets
        set_kinds: [secrets]
        manifest: "{{ lookup('template', 'templates/secrets.yaml.j2') }}"

    - name: Publish repository and charts
      ansible.builtin.include_tasks: tasks/gitops-publish.yml
      when: gitops.publish is defined

    # Releases installed by earlier versions of this playbook (plain Helm): forget them (delete Helm's
    # release records, keep the resources) so Argo CD adopts the resources without downtime.
    - name: Forget Helm releases now managed by Argo CD
      ansible.builtin.command: >-
        {{ kubectl }} delete secret -A -l 'owner=helm,name in ({{ root_values.apps.keys() | join(',') }})'
        --ignore-not-found
      register: forgotten
      changed_when: "'deleted' in forgotten.stdout"

    # Earlier versions applied these with Ansible (label lgtm/set). Objects with the same names are adopted
    # by Argo CD; only the per-hostname VIP Services of the old design have no successor.
    - name: Remove the per-hostname VIP Services of earlier versions
      ansible.builtin.command: "{{ kubectl }} -n kube-system delete service -l lgtm/set=vips --ignore-not-found"
      register: old_vips
      changed_when: "'deleted' in old_vips.stdout"

    - name: Install Argo CD
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - upgrade
          - --install
          - argocd
          - "{{ artifacts_dir }}/charts/argo-cd-{{ charts['argo-cd'].version }}.tgz"
          - --kubeconfig={{ repo_dir }}/kubeconfig
          - --namespace=argocd
          - --values={{ repo_dir }}/k8s/values/argocd.yaml
          - --wait
          - --timeout=10m
      register: argocd_install
      changed_when: "'REVISION: 1' in argocd_install.stdout"

    - name: Root Application (app of apps)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: gitops
        set_kinds: [applications.argoproj.io]
        manifest: "{{ lookup('template', 'templates/root-app.yaml.j2') }}"

    - name: Wait until Argo CD reports every Application healthy
      ansible.builtin.command: "{{ kubectl }} -n argocd get applications.argoproj.io -o json"
      register: argo_apps
      changed_when: false
      vars:
        app_items: "{{ (argo_apps.stdout | from_json)['items'] }}"
        healthy: >-
          {{ app_items | selectattr('status.health.status', 'defined')
             | selectattr('status.health.status', 'equalto', 'Healthy') | list }}
      until: >-
        argo_apps.rc == 0 and app_items | length == root_values.apps | length + 1
        and healthy | length == app_items | length
      retries: 90
      delay: 20

    - name: Grafana organizations per tenant (datasources scoped to the tenant, dashboards)
      ansible.builtin.include_tasks: tasks/grafana-tenants.yml
      loop: "{{ tenants }}"
      loop_control: { loop_var: tenant, label: "{{ tenant.name }}" }

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Grafana: http(s)://grafana.{{ domain }}  user admin, password in .secrets/grafana_admin_password"
          - "Argo CD: http(s)://argocd.{{ domain }}  user admin, password in Secret argocd/argocd-initial-admin-secret"
          - "DNS / hosts file: {{ ingress_vip }} {{ lgtm_hosts | map('regex_replace', '$', '.' ~ domain) | join(' ') }}"
