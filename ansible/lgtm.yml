# Deploys the LGTM stack the GitOps way: Ansible creates the Secrets, publishes repository and charts,
# installs Argo CD once and applies the root Application with the site's settings from the inventory. Argo CD
# deploys everything else from Git (argocd/root), including itself: a change in Git is rolled out without
# Ansible; run this playbook again after inventory changes.
#   ansible-playbook -i <inventory> ansible/lgtm.yml
- name: Deploy the LGTM stack with Argo CD
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "{{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig"
    grafana_api: "http://{{ ingress_vip }}/api"

    # the apps of the root app (argocd/root/values.yaml), for waiting
    root_apps: "{{ (lookup('file', repo_dir ~ '/argocd/root/values.yaml') | from_yaml).apps }}"
    # the site's settings for the root app; grafana_org_ids: tenant orgs that exist (looked up below)
    site_values: "{{ lookup('template', 'templates/site-values.yaml.j2') | from_yaml }}"

    # Ansible waits for every app not marked "wait: false" (those are only reported). Not for the root app "lgtm":
    # its health includes its children's, so a "wait: false" app that is Degraded would block it.
    waited_apps: >-
      {{ (root_apps | dict2items | rejectattr('value.wait', 'defined') | map(attribute='key') | list)
         + (root_apps | dict2items | selectattr('value.wait', 'defined') | selectattr('value.wait')
            | map(attribute='key') | list) }}
    # "Sync/Health: message" per Application, from the last "kubectl get applications" (argo_apps)
    app_states: >-
      {%- set states = {} -%}
      {%- for a in ((argo_apps.stdout | default('', true) or '{"items": []}') | from_json)['items'] -%}
      {%-   set state = a.status.sync.status | default('?') ~ '/' ~ a.status.health.status | default('?') -%}
      {%-   set msg = a.status.health.message | default(a.status.operationState.message | default(
             (a.status.conditions | default([{}]))[0].message | default(''))) -%}
      {%-   set _ = states.update({a.metadata.name: state
             ~ ((': ' ~ msg) if msg and state != 'Synced/Healthy' else '')}) -%}
      {%- endfor -%}{{ states }}
    not_ready: >-
      {{ waited_apps | reject('in', app_states | dict2items | selectattr('value', 'match', 'Synced/Healthy')
         | map(attribute='key') | list) | list }}

  tasks:
    - name: Secrets (namespaces, S3, Grafana admin + OAuth, Argo CD OAuth, PG Back Web, EAB, repository credentials)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: secrets
        set_kinds: [secrets]
        manifest: "{{ lookup('template', 'templates/secrets.yaml.j2') }}"

    - name: First CA bundle for Argo CD (system CAs + certs/; trust-manager takes it over)
      ansible.builtin.command:
        cmd: "{{ kubectl }} create -f -"
        stdin: "{{ lookup('template', 'templates/ca-bundle-bootstrap.yaml.j2') }}"
      vars:
        ca_files: >-
          {{ [lookup('first_found', ['/etc/ssl/certs/ca-certificates.crt', '/etc/pki/tls/certs/ca-bundle.crt'])]
             + query('fileglob', repo_dir ~ '/certs/*.pem', repo_dir ~ '/certs/*.crt')
             + trusted_ca_files | default([]) }}
      register: ca_bootstrap
      changed_when: ca_bootstrap.rc == 0
      failed_when: ca_bootstrap.rc != 0 and 'AlreadyExists' not in ca_bootstrap.stderr

    - name: Publish repository and charts
      ansible.builtin.include_tasks: tasks/gitops-publish.yml
      when: gitops.publish is defined

    # Argo CD manages itself from Git (apps.argocd): Helm only installs it the first time, with the health check
    # the app of apps needs. Later runs leave it to Argo CD.
    - name: Argo CD installed?
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - status
          - argocd
          - --namespace=argocd
          - --kubeconfig={{ repo_dir }}/kubeconfig
      register: argocd_status
      changed_when: false
      failed_when: false

    - name: Install Argo CD (first time only)
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - install
          - argocd
          - "{{ artifacts_dir }}/charts/argo-cd-{{ charts['argo-cd'].version }}.tgz"
          - --kubeconfig={{ repo_dir }}/kubeconfig
          - --namespace=argocd
          - --create-namespace
          - --values={{ repo_dir }}/k8s/values/argocd.yaml
          - --set-file=configs.cm.resource\.customizations\.health\.argoproj\.io_Application={{
            repo_dir }}/argocd/root/files/application-health.lua
          - --wait
          - --timeout=10m
      when: argocd_status.rc != 0
      changed_when: true

    # The datasources of a tenant org are provisioned by Grafana (argocd/root) once the org exists. Before the
    # first start of Grafana there are none yet; they are created below and the root app is updated.
    - name: Grafana orgs that exist already
      ansible.builtin.uri:
        url: "{{ grafana_api }}/orgs"
        headers: { Host: "grafana.{{ domain }}" }
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        timeout: 10
      register: grafana_orgs_before
      failed_when: false

    - name: Remember their ids
      ansible.builtin.set_fact:
        grafana_org_ids: >-
          {{ (grafana_orgs_before.json | default([]) if grafana_orgs_before.status | default(0) == 200 else [])
             | items2dict(key_name='name', value_name='id') }}

    - name: Root Application (app of apps)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: gitops
        set_kinds: [applications.argoproj.io]
        manifest: "{{ lookup('template', 'templates/root-app.yaml.j2') }}"

    - name: Applications to wait for
      ansible.builtin.debug:
        msg:
          waiting_for: "{{ waited_apps }}"
          not_waited_for (wait false): "{{ root_apps.keys() | reject('in', waited_apps) | list }}"

    - name: Wait until Argo CD reports these Applications synced and healthy (max. 30 minutes)
      ansible.builtin.command: "{{ kubectl }} -n argocd get applications.argoproj.io -o json"
      register: argo_apps
      changed_when: false
      failed_when: false                  # a timeout is reported by the next two tasks
      until: argo_apps.rc == 0 and not_ready | length == 0
      retries: 90
      delay: 20

    - name: Argo CD Applications (sync/health)
      ansible.builtin.debug:
        msg:
          waited_for: "{{ app_states | dict2items | selectattr('key', 'in', waited_apps) | items2dict }}"
          not_waited_for: "{{ app_states | dict2items | rejectattr('key', 'in', waited_apps) | items2dict }}"

    - name: Fail if an Application is not ready
      ansible.builtin.fail:
        msg: >-
          Not synced and healthy after 30 minutes:
          {% for app in not_ready %}{{ app }} ({{ app_states[app] | default('no such Application') }})
          {{- ', ' if not loop.last }}{% endfor %}
      when: not_ready | length > 0

    - name: Grafana Main org (cross-tenant, for admins)
      ansible.builtin.include_tasks: tasks/grafana-main-org.yml

    - name: Grafana organizations per tenant (datasources scoped to the tenant, dashboards)
      ansible.builtin.include_tasks: tasks/grafana-tenants.yml
      loop: "{{ tenants }}"
      loop_control: { loop_var: tenant, label: "{{ tenant.name }}" }

    - name: Grafana orgs now
      ansible.builtin.uri:
        url: "{{ grafana_api }}/orgs"
        headers: { Host: "grafana.{{ domain }}" }
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: grafana_orgs_after

    - name: New tenant orgs -> their datasources (root Application with the org ids)
      vars:
        new_ids: "{{ grafana_orgs_after.json | items2dict(key_name='name', value_name='id') }}"
      when: tenants | map(attribute='name') | select('in', new_ids) | reject('in', grafana_org_ids) | list | length > 0
      block:
        - name: Remember the new org ids
          ansible.builtin.set_fact:
            grafana_org_ids: "{{ new_ids }}"

        - name: Update the root Application
          ansible.builtin.include_tasks: tasks/apply-set.yml
          vars:
            set_name: gitops
            set_kinds: [applications.argoproj.io]
            manifest: "{{ lookup('template', 'templates/root-app.yaml.j2') }}"

    - name: PG Back Web (login, Grafana's database, S3 destination, daily backup)
      ansible.builtin.include_tasks: tasks/pgbackweb.yml
      when: "'pgbackweb' in lgtm_hosts"

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Grafana: http(s)://grafana.{{ domain }}  user admin, password in .secrets/grafana_admin_password"
          - "Argo CD: http(s)://argocd.{{ domain }}  SSO, or user admin with the password in Secret
            argocd/argocd-initial-admin-secret"
          - "PG Back Web: http(s)://pgbackweb.{{ domain }}  admin@{{ domain }}, password in
            .secrets/pgbackweb_admin_password"
          - "DNS / hosts file: {{ ingress_vip }} {{ lgtm_hosts | map('regex_replace', '$', '.' ~ domain) | join(' ') }}"
