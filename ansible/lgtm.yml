# Deploys the LGTM stack the GitOps way: Ansible creates the Secrets, publishes repository and charts,
# installs Argo CD and the root Application; Argo CD deploys everything else from Git (argocd/root).
#   ansible-playbook -i <inventory> ansible/lgtm.yml
- name: Deploy the LGTM stack with Argo CD
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "{{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig"

    # values of the root app, incl. the platform and Grafana overlays (ansible/templates/*-values.yaml.j2)
    root_values: "{{ lookup('template', 'templates/root-values.yaml.j2') | from_yaml }}"

    # Ansible waits for the root app and every app not marked "wait: false" (those are only reported)
    waited_apps: >-
      {{ ['lgtm'] + (root_values.apps | dict2items | rejectattr('value.wait', 'defined') | map(attribute='key') | list)
         + (root_values.apps | dict2items | selectattr('value.wait', 'defined') | selectattr('value.wait')
            | map(attribute='key') | list) }}
    # "Sync/Health: message" per Application, from the last "kubectl get applications" (argo_apps)
    app_states: >-
      {%- set states = {} -%}
      {%- for a in ((argo_apps.stdout | default('', true) or '{"items": []}') | from_json)['items'] -%}
      {%-   set state = a.status.sync.status | default('?') ~ '/' ~ a.status.health.status | default('?') -%}
      {%-   set msg = a.status.health.message | default(a.status.operationState.message | default(
             (a.status.conditions | default([{}]))[0].message | default(''))) -%}
      {%-   set _ = states.update({a.metadata.name: state
             ~ ((': ' ~ msg) if msg and state != 'Synced/Healthy' else '')}) -%}
      {%- endfor -%}{{ states }}
    not_ready: >-
      {{ waited_apps | reject('in', app_states | dict2items | selectattr('value', 'match', 'Synced/Healthy')
         | map(attribute='key') | list) | list }}

  tasks:
    - name: Secrets (namespaces, S3, Grafana admin + OAuth, EAB, repository credentials)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: secrets
        set_kinds: [secrets]
        manifest: "{{ lookup('template', 'templates/secrets.yaml.j2') }}"

    - name: First CA bundle for Argo CD (system CAs + certs/; trust-manager takes it over)
      ansible.builtin.command:
        cmd: "{{ kubectl }} create -f -"
        stdin: "{{ lookup('template', 'templates/ca-bundle-bootstrap.yaml.j2') }}"
      vars:
        ca_files: >-
          {{ [lookup('first_found', ['/etc/ssl/certs/ca-certificates.crt', '/etc/pki/tls/certs/ca-bundle.crt'])]
             + query('fileglob', repo_dir ~ '/certs/*.pem', repo_dir ~ '/certs/*.crt') }}
      register: ca_bootstrap
      changed_when: ca_bootstrap.rc == 0
      failed_when: ca_bootstrap.rc != 0 and 'AlreadyExists' not in ca_bootstrap.stderr

    - name: Publish repository and charts
      ansible.builtin.include_tasks: tasks/gitops-publish.yml
      when: gitops.publish is defined

    - name: Install Argo CD
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - upgrade
          - --install
          - argocd
          - "{{ artifacts_dir }}/charts/argo-cd-{{ charts['argo-cd'].version }}.tgz"
          - --kubeconfig={{ repo_dir }}/kubeconfig
          - --namespace=argocd
          - --values={{ repo_dir }}/k8s/values/argocd.yaml
          - --set-file=configs.cm.resource\.customizations\.health\.argoproj\.io_Application={{
            repo_dir }}/k8s/argocd/application-health.lua
          - --wait
          - --timeout=10m
      register: argocd_install
      changed_when: "'REVISION: 1' in argocd_install.stdout"

    - name: Root Application (app of apps)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: gitops
        set_kinds: [applications.argoproj.io]
        manifest: "{{ lookup('template', 'templates/root-app.yaml.j2') }}"

    - name: Applications to wait for
      ansible.builtin.debug:
        msg:
          waiting_for: "{{ waited_apps }}"
          not_waited_for: "{{ root_values.apps.keys() | reject('in', waited_apps) | list }} (wait: false)"

    - name: Wait until Argo CD reports these Applications synced and healthy (max. 30 minutes)
      ansible.builtin.command: "{{ kubectl }} -n argocd get applications.argoproj.io -o json"
      register: argo_apps
      changed_when: false
      failed_when: false                  # a timeout is reported by the next two tasks
      until: argo_apps.rc == 0 and not_ready | length == 0
      retries: 90
      delay: 20

    - name: Argo CD Applications (sync/health)
      ansible.builtin.debug:
        msg:
          waited_for: "{{ app_states | dict2items | selectattr('key', 'in', waited_apps) | items2dict }}"
          not_waited_for: "{{ app_states | dict2items | rejectattr('key', 'in', waited_apps) | items2dict }}"

    - name: Fail if an Application is not ready
      ansible.builtin.fail:
        msg: >-
          Not synced and healthy after 30 minutes:
          {% for app in not_ready %}{{ app }} ({{ app_states[app] | default('no such Application') }})
          {{- ', ' if not loop.last }}{% endfor %}
      when: not_ready | length > 0

    - name: Grafana Main org (cross-tenant, for admins)
      ansible.builtin.include_tasks: tasks/grafana-main-org.yml

    - name: Grafana organizations per tenant (datasources scoped to the tenant, dashboards)
      ansible.builtin.include_tasks: tasks/grafana-tenants.yml
      loop: "{{ tenants }}"
      loop_control: { loop_var: tenant, label: "{{ tenant.name }}" }

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Grafana: http(s)://grafana.{{ domain }}  user admin, password in .secrets/grafana_admin_password"
          - "Argo CD: http(s)://argocd.{{ domain }}  user admin, password in Secret argocd/argocd-initial-admin-secret"
          - "DNS / hosts file: {{ ingress_vip }} {{ lgtm_hosts | map('regex_replace', '$', '.' ~ domain) | join(' ') }}"
