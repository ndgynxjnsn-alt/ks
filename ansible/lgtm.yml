# Installs/updates the LGTM stack from the downloaded charts (artifacts/charts) using ./kubeconfig.
# Images are preloaded on the nodes by site.yml, so the cluster needs no registry access.
- name: Deploy the LGTM stack
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "{{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig"
    releases:
      - name: cert-manager
        namespace: cert-manager
        chart: "cert-manager-{{ charts['cert-manager'].version }}.tgz"
        secrets: {}
      - name: cloudnative-pg
        namespace: cnpg-system
        chart: "cloudnative-pg-{{ charts['cloudnative-pg'].version }}.tgz"
        secrets: {}
      - name: loki
        chart: "loki-{{ charts.loki.version }}.tgz"
        secrets:
          loki: { storage: { s3: { endpoint: "{{ s3_endpoint }}", accessKeyId: "{{ s3_access_key_id }}", secretAccessKey: "{{ s3_secret_access_key }}" } } }
      - name: mimir
        chart: "mimir-distributed-{{ mimir_chart.version }}.tgz"
        secrets:
          mimir: { structuredConfig: { common: { storage: { s3: { endpoint: "{{ s3_endpoint }}", access_key_id: "{{ s3_access_key_id }}", secret_access_key: "{{ s3_secret_access_key }}" } } } } }
      - name: tempo
        chart: "tempo-{{ charts.tempo.version }}.tgz"
        secrets:
          tempo: { storage: { trace: { s3: { endpoint: "{{ s3_endpoint }}", access_key: "{{ s3_access_key_id }}", secret_key: "{{ s3_secret_access_key }}" } } } }
      - name: pyroscope
        chart: "pyroscope-{{ charts.pyroscope.version }}.tgz"
        secrets:
          pyroscope: { structuredConfig: { storage: { s3: { endpoint: "{{ s3_endpoint }}", access_key_id: "{{ s3_access_key_id }}", secret_access_key: "{{ s3_secret_access_key }}" } } } }
      - name: alloy
        chart: "alloy-{{ charts.alloy.version }}.tgz"
        secrets: {}
      - name: grafana
        chart: "grafana-{{ charts.grafana.version }}.tgz"
        secrets: "{{ grafana_overlay | combine(grafana_oauth_overlay if oauth.enabled else {}, recursive=true) }}"
    grafana_overlay:
          adminPassword: "{{ grafana_admin_password }}"          # Main org: all tenants (cross-tenant queries); tenant orgs are set up via the API below
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources: "{{ lookup('template', 'templates/grafana-datasources.yaml.j2',
                               template_vars={'ds_tenants': tenants | map(attribute='name') | list, 'ds_dollar': '$$'}) | from_yaml }}"
    # Login via Keycloak (external/). Keycloak group -> Grafana org/role:
    #   grafana-admins -> Admin in every org + Grafana server admin;  tenant-<name> -> Editor in org <name>
    # auto_assign_org is off, so tenant users don't land in the Main org (which sees all tenants).
    grafana_oauth_overlay:
      hostAliases:
        - { ip: "{{ external_host_ip }}", hostnames: ["{{ oauth.hostname }}"] }
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef: { name: grafana-oauth, key: client-secret }
      grafana.ini:
        users:
          auto_assign_org: false
        auth.generic_oauth:
          enabled: true
          name: Keycloak
          allow_sign_up: true
          client_id: "{{ oauth.client_id }}"
          scopes: openid email profile
          use_pkce: true
          auth_url: "{{ oauth.issuer }}/protocol/openid-connect/auth"
          token_url: "{{ oauth.issuer }}/protocol/openid-connect/token"
          api_url: "{{ oauth.issuer }}/protocol/openid-connect/userinfo"
          signout_redirect_url: "{{ oauth.issuer }}/protocol/openid-connect/logout?client_id={{ oauth.client_id }}&post_logout_redirect_uri=https%3A%2F%2F{{ service_vips.grafana.host }}%2Flogin"
          login_attribute_path: preferred_username
          email_attribute_path: email
          name_attribute_path: name
          groups_attribute_path: groups
          role_attribute_path: "contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' || 'Viewer'"
          allow_assign_grafana_admin: true
          org_attribute_path: groups
          org_mapping: >-
            grafana-admins:*:Admin
            {% for t in tenants %}tenant-{{ t.name }}:{{ t.name }}:Editor {% endfor %}
  tasks:
    - name: Floating IPs per hostname (LoadBalancer Services) and the in-cluster Garage endpoint
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: vips
        set_kinds: [services, endpointslices]
        manifest: "{{ lookup('template', 'templates/vips.yaml.j2') }}"

    - name: Grafana dashboards (ConfigMap, provisioned by the Grafana chart)
      ansible.builtin.shell:
        cmd: >-
          {{ kubectl }} -n lgtm create configmap grafana-dashboards --from-file={{ repo_dir }}/k8s/dashboards
          --dry-run=client -o yaml | {{ kubectl }} apply -f -
      register: dashboards
      changed_when: "'configured' in dashboards.stdout or 'created' in dashboards.stdout"

    # helm CLI directly: kubernetes.core.helm 6.x still calls `helm list --all`, which Helm 4 removed.
    # Secrets are passed on stdin (-f -), so they never land on disk or in the process list.
    - name: Install Helm releases
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - upgrade
          - --install
          - "{{ item.name }}"
          - "{{ artifacts_dir }}/charts/{{ item.chart }}"
          - --kubeconfig={{ repo_dir }}/kubeconfig
          - --namespace={{ item.namespace | default('lgtm') }}
          - --create-namespace
          - --values={{ repo_dir }}/k8s/values/{{ item.name }}.yaml
          - --values=-
          - --wait
          - --timeout=15m
        stdin: "{{ item.secrets | to_nice_yaml }}"
      loop: "{{ releases | rejectattr('name', 'equalto', 'grafana') }}"
      loop_control: { label: "{{ item.name }}" }

    - name: OAuth client secret for Grafana
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: oauth
        set_kinds: [secrets]
        manifest: "{{ lookup('template', 'templates/oauth.yaml.j2') }}"
      when: oauth.enabled

    - name: PostgreSQL cluster for Grafana (CloudNativePG)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: grafana-db
        set_kinds: [clusters.postgresql.cnpg.io]
        manifest: "{{ lookup('template', 'templates/grafana-db.yaml.j2') }}"

    - name: Wait until the database cluster is ready
      ansible.builtin.command: "{{ kubectl }} -n lgtm wait cluster/grafana-db --for=condition=Ready --timeout=15m"
      changed_when: false

    - name: Install Grafana
      ansible.builtin.command:
        argv:
          - "{{ artifacts_dir }}/bin/helm"
          - upgrade
          - --install
          - grafana
          - "{{ artifacts_dir }}/charts/{{ grafana.chart }}"
          - --kubeconfig={{ repo_dir }}/kubeconfig
          - --namespace=lgtm
          - --values={{ repo_dir }}/k8s/values/grafana.yaml
          - --values=-
          - --wait
          - --timeout=15m
        stdin: "{{ grafana.secrets | to_nice_yaml }}"
      vars:
        grafana: "{{ releases | selectattr('name', 'equalto', 'grafana') | first }}"

    - name: Certificate issuer (company CA)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: tls
        set_kinds: [clusterissuers, secrets]
        manifest: "{{ lookup('template', 'templates/tls.yaml.j2') }}"

    - name: Ingresses (http + https per hostname)
      ansible.builtin.include_tasks: tasks/apply-set.yml
      vars:
        set_name: ingress
        set_kinds: [ingresses]
        manifest: "{{ lookup('template', 'templates/ingress.yaml.j2') }}"

    - name: Grafana organizations per tenant (datasources scoped to the tenant, dashboards)
      ansible.builtin.include_tasks: tasks/grafana-tenants.yml
      loop: "{{ tenants }}"
      loop_control: { loop_var: tenant, label: "{{ tenant.name }}" }

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Grafana: http(s)://grafana.org  user admin, password in .secrets/grafana_admin_password"
          - "/etc/hosts: {{ service_vips.values() | map(attribute='ip') | zip(service_vips.values() | map(attribute='host')) | map('join', ' ') | list }}"
