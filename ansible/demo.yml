# Builds the demo app image on the Ansible host (Jib, no Docker daemon) and pushes it to the artifact repository
# (inventory: registry) as <registry.host>/lgtm.local/demo; the nodes pull lgtm.local/demo through their mirror.
- name: Build the demo image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_dir: "{{ repo_dir }}/apps/demo"
  tasks:
    - name: Compile
      ansible.builtin.command: ./mvnw -q clean package -DskipTests
      args: { chdir: "{{ app_dir }}" }
      changed_when: false   # build output only; whether the image changed is decided by its ID below

    - name: Create agents directory
      ansible.builtin.file: { path: "{{ app_dir }}/target/agents", state: directory, mode: "0755" }

    - name: Download the OTel Java agent, the Pyroscope Java agent and the Pyroscope OTel extension
      ansible.builtin.get_url:
        url: "https://github.com/{{ item.repo }}/releases/download/v{{ item.version }}/{{ item.file }}"
        dest: "{{ app_dir }}/target/agents/"
        mode: "0644"
      loop:
        - { repo: open-telemetry/opentelemetry-java-instrumentation, version: "{{ otel_agent_version }}",
            file: opentelemetry-javaagent.jar }
        - { repo: grafana/pyroscope-java, version: "{{ pyroscope_agent_version }}", file: pyroscope.jar }
        - { repo: grafana/otel-profiling-java, version: "{{ pyroscope_otel_version }}", file: pyroscope-otel.jar }
      loop_control: { label: "{{ item.file }}" }

    - name: Build image tarball
      ansible.builtin.command: ./mvnw -q jib:buildTar -Dimage={{ demo_image }}
      args: { chdir: "{{ app_dir }}" }
      changed_when: false

    # Jib builds are reproducible: unchanged code -> same image digest -> nothing to restart
    - name: Push the image (the pods are restarted only if its digest changed)
      ansible.builtin.shell:
        cmd: |
          set -e
          before=$({{ crane }} digest {{ dest }} 2>/dev/null || true)
          {{ crane }} push {{ app_dir }}/target/jib-image.tar {{ dest }} >/dev/null
          after=$({{ crane }} digest {{ dest }})
          [ "$before" = "$after" ] && echo UNCHANGED || echo PUSHED
      environment: { DOCKER_CONFIG: "{{ artifacts_dir }}/work/docker-config" }   # written by publish.yml
      vars:
        crane: "{{ artifacts_dir }}/bin/crane{{ ' --insecure' if registry.insecure | default(false) else '' }}"
        dest: "{{ registry.host }}/{{ demo_image }}"
      register: demo_push
      changed_when: "'PUSHED' in demo_push.stdout"
      notify: Restart the demo pods

  # The manifests (k8s/demo) are deployed by Argo CD (app "demo"). Same tag with new content: delete the pods (not
  # "rollout restart", which would change the Deployment spec that Argo CD keeps in sync); they pull the tag again
  # (imagePullPolicy: Always).
  handlers:
    - name: Restart the demo pods
      ansible.builtin.command: >-
        {{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig -n demo delete pods --all --wait=false
      changed_when: true
