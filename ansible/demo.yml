# Builds the demo app image on the Ansible host (Jib, no Docker daemon), loads it on every node, deploys it.
- name: Build the demo image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_dir: "{{ repo_dir }}/apps/demo"
  tasks:
    - name: Compile
      ansible.builtin.command: ./mvnw -q clean package -DskipTests
      args: { chdir: "{{ app_dir }}" }
      changed_when: false   # build output only; whether the image changed is decided by its ID below

    - name: Create agents directory
      ansible.builtin.file: { path: "{{ app_dir }}/target/agents", state: directory, mode: "0755" }

    - name: Download the OTel Java agent, the Pyroscope Java agent and the Pyroscope OTel extension
      ansible.builtin.get_url:
        url: "https://github.com/{{ item.repo }}/releases/download/v{{ item.version }}/{{ item.file }}"
        dest: "{{ app_dir }}/target/agents/"
        mode: "0644"
      loop:
        - { repo: open-telemetry/opentelemetry-java-instrumentation, version: "{{ otel_agent_version }}",
            file: opentelemetry-javaagent.jar }
        - { repo: grafana/pyroscope-java, version: "{{ pyroscope_agent_version }}", file: pyroscope.jar }
        - { repo: grafana/otel-profiling-java, version: "{{ pyroscope_otel_version }}", file: pyroscope-otel.jar }
      loop_control: { label: "{{ item.file }}" }

    - name: Build image tarball
      ansible.builtin.command: ./mvnw -q jib:buildTar -Dimage={{ demo_image }}
      args: { chdir: "{{ app_dir }}" }
      changed_when: false

    # Image ID = sha256 of the image config; Jib builds are reproducible, so unchanged code -> same ID.
    - name: Image ID of the new build
      ansible.builtin.shell: >-
        set -o pipefail; t={{ app_dir }}/target/jib-image.tar;
        tar -xOf $t "$(tar -xOf $t manifest.json | jq -r '.[0].Config')" | sha256sum | cut -d' ' -f1
      args: { executable: /bin/bash }
      register: built
      changed_when: false

- name: Load the image on every node (only if it changed)
  hosts: nodes
  become: true
  gather_facts: false
  vars:
    built_id: "sha256:{{ hostvars['localhost'].built.stdout }}"
  tasks:
    - name: Image ID on the node
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock
        inspecti -o go-template --template '{{ '{{' }}.status.id{{ '}}' }}' {{ demo_image }}
      register: node_image
      changed_when: false
      failed_when: false

    - name: Copy and import the image
      when: node_image.stdout | trim != built_id
      block:
        - name: Copy image tarball
          ansible.builtin.copy:
            src: "{{ repo_dir }}/apps/demo/target/jib-image.tar"
            dest: /var/lib/rancher/rke2/agent/images/demo.tar
            mode: "0644"

        - name: Import image into containerd
          ansible.builtin.command: >-
            /var/lib/rancher/rke2/bin/ctr -a /run/k3s/containerd/containerd.sock -n k8s.io
            images import /var/lib/rancher/rke2/agent/images/demo.tar
          changed_when: true

# The manifests (k8s/demo) are deployed by Argo CD (app "demo"). Same tag with new content: delete the
# pods (not "rollout restart", which would change the Deployment spec that Argo CD keeps in sync).
- name: Restart the demo pods to pick up a new image
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "{{ artifacts_dir }}/bin/kubectl --kubeconfig {{ repo_dir }}/kubeconfig"
    image_changed: >-
      {{ groups['nodes'] | map('extract', hostvars, ['node_image', 'stdout'])
         | map('trim') | reject('equalto', 'sha256:' ~ built.stdout) | list | length > 0 }}
  tasks:
    - name: Delete the demo pods (the Deployments recreate them)
      ansible.builtin.command: "{{ kubectl }} -n demo delete pods --all --wait=false"
      when: image_changed | bool
      changed_when: true
