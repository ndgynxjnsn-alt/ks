# Applies a rendered manifest as a named "set" and removes objects of that set that are no longer rendered
# (state: absent semantics - nothing to remove is fine, also when a resource type doesn't exist yet).
# Every object in the manifest must carry the label lgtm/set: <set_name>.
#   Vars: set_name, manifest (YAML string), set_kinds (kubectl resource names)
- name: "Apply set {{ set_name }}"
  ansible.builtin.command:
    cmd: "{{ kubectl }} apply -f -"
    stdin: "{{ manifest }}"
  register: applied
  changed_when: "'configured' in applied.stdout or 'created' in applied.stdout"

# --ignore-not-found: a resource type that isn't installed yet (CRD missing) simply has no objects
- name: "List the cluster objects of set {{ set_name }}"
  ansible.builtin.command: >-
    {{ kubectl }} get {{ set_kinds | join(',') }} -A -l lgtm/set={{ set_name }} -o json --ignore-not-found
  register: existing
  changed_when: false
  failed_when: existing.rc != 0 and "the server doesn't have a resource type" not in existing.stderr

- name: "Remove objects that are no longer part of set {{ set_name }}"
  ansible.builtin.command: >-
    {{ kubectl }} delete {{ item.kind }} {{ item.metadata.name }} --ignore-not-found
    {{ ('-n ' ~ item.metadata.namespace) if item.metadata.namespace is defined else '' }}
  loop: "{{ (existing.stdout | from_json)['items'] if existing.stdout | length > 0 else [] }}"
  loop_control: { label: "{{ item.kind }}/{{ item.metadata.name }}" }
  when: (item.kind ~ '/' ~ item.metadata.name) not in wanted
  register: removed
  changed_when: "'deleted' in removed.stdout"
  vars:
    wanted: >-
      {{ manifest | from_yaml_all | select | map(attribute='kind')
         | zip(manifest | from_yaml_all | select | map(attribute='metadata.name')) | map('join', '/') | list }}
