# One Grafana organization per tenant: created via the HTTP API (provisioning can't create orgs), and Git Sync
# of the tenant's directory in Grafana's Git repository (dashboards). Its datasources are provisioned by Grafana
# (argocd/root/templates/_datasources.tpl) once ansible/lgtm.yml passed the org id to the root app.
# Idempotent. Var: tenant ({name})
- name: "Grafana org {{ tenant.name }}"
  vars:
    grafana_api: "http://{{ ingress_vip }}/api"
    grafana_headers: { Host: "grafana.{{ domain }}" }
  block:
    - name: Wait for the Grafana API
      ansible.builtin.uri:
        url: "{{ grafana_api }}/health"
        headers: "{{ grafana_headers }}"
      register: health
      until: health.status == 200
      retries: 30
      delay: 10

    - name: "Look up org {{ tenant.name }}"
      ansible.builtin.uri:
        url: "{{ grafana_api }}/orgs/name/{{ tenant.name }}"
        headers: "{{ grafana_headers }}"
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: org_lookup

    - name: "Create the org (the admin user becomes its Admin): {{ tenant.name }}"
      ansible.builtin.uri:
        url: "{{ grafana_api }}/orgs"
        method: POST
        headers: "{{ grafana_headers }}"
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: { name: "{{ tenant.name }}" }
      register: org_created
      when: org_lookup.status == 404
      changed_when: true

    - name: Remember the org id
      ansible.builtin.set_fact:
        tenant_org_id: "{{ org_created.json.orgId if org_lookup.status == 404 else org_lookup.json.id }}"

    - name: "Git Sync: dashboards of org {{ tenant.name }}"
      ansible.builtin.include_tasks: grafana-git-sync.yml
      vars: { git_sync_org_id: "{{ tenant_org_id }}", git_sync_dir: "{{ tenant.name }}" }
      when: grafana_git_sync is defined
