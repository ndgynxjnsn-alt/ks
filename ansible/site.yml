# Sets up the nodes completely offline from artifacts/ (run download.yml first).
- name: Bootstrap privilege escalation
  hosts: nodes
  gather_facts: false
  tasks:
    # Ubuntu 26.04 uses sudo-rs as sudo; Ansible's become can't handle its password prompt. Removing the
    # package falls back to the classic sudo that Ubuntu still ships. Plain `raw` + `sudo -S`, no become yet.
    - name: Replace sudo-rs with classic sudo
      ansible.builtin.raw: |
        if dpkg-query -W -f='${Status}' sudo-rs 2>/dev/null | grep -q 'ok installed'; then
          printf '%s\n' {{ ansible_become_password | quote }} | sudo -S -p '' \
            env DEBIAN_FRONTEND=noninteractive apt-get remove -y sudo-rs && echo REMOVED
        fi
      register: sudo_rs
      changed_when: "'REMOVED' in sudo_rs.stdout"
      no_log: true

- name: LVM volume group for TopoLVM, Garage S3 on the remaining disks
  hosts: nodes
  become: true
  roles: [topolvm, garage]

# Only with --tags buckets: adds new buckets of garage_buckets to a running Garage (the play above rebuilds it)
- name: Garage buckets
  hosts: nodes[0]
  become: true
  gather_facts: false
  tags: [never, buckets]
  tasks:
    - name: Create missing buckets
      ansible.builtin.include_role: { name: garage, tasks_from: buckets }

- name: OTLP/JSON import directories
  hosts: nodes
  become: true
  roles: [otel_import]
  tags: [otel-import]

- name: First RKE2 server (bootstraps etcd and kube-vip)
  hosts: nodes[0]
  become: true
  roles: [rke2]

- name: Remaining RKE2 servers, one at a time (etcd members join sequentially)
  hosts: nodes[1:]
  become: true
  serial: 1
  roles: [rke2]

- name: Kubeconfig for the Ansible host, pointing at the VIP
  hosts: nodes[0]
  become: true
  gather_facts: false
  tasks:
    - name: Read admin kubeconfig
      ansible.builtin.slurp: { src: /etc/rancher/rke2/rke2.yaml }
      register: kubeconfig

    - name: Write ./kubeconfig
      ansible.builtin.copy:
        content: "{{ kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + vip + ':6443') }}"
        dest: "{{ repo_dir }}/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
